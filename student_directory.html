.detailTop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}.detailTop h2{margin:0}.detailGrades{white-space:nowrap;border-radius:100px;background:#e7f6ed;color:#175d42;border:1px solid #9bcfb1}.detailGrades:hover{background:#d5f0df}@media(max-width:600px){.detailGrades{width:100%;text-align:center}}

body{background:radial-gradient(circle at 98% 5%,#fff1cf 0,transparent 350px),radial-gradient(circle at 3% 38%,#e6f8f0 0,transparent 450px),#fbfdfb;color:#244a3d}

<body>
<header><div class="brand"><span class="brandIcon" aria-hidden="true">🔎</span><div><h1>生徒情報検索</h1><div class="sub">個別指導STEP · 生徒マスタ</div></div></div><button id="logout" class="btn small secondary hidden" type="button">ログアウト</button></header>
<main>
 <section id="login" class="card login hidden"><h2>管理者ログイン</h2><p class="muted">成績管理と同じ管理者ID・パスワードを使用します。初回のログイン後は、ログアウトするまで保持します。</p><label>講師番号<input id="code" autocomplete="username" inputmode="numeric"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton" class="btn" type="button">ログイン</button><p id="loginError" class="error" role="alert"></p></section>
 <div id="app" class="hidden"><section class="card searchCard"><div class="searchTitle"><span class="searchTitleIcon" aria-hidden="true">🌱</span><div><h2>生徒を探す</h2><p>名前や生徒番号を入力すると、すぐに候補が表示されます。</p></div></div><div class="row searchRow"><div class="searchWrap"><span class="searchWrapIcon" aria-hidden="true">🔍</span><input id="search" class="search" type="search" autocomplete="off" placeholder="名前・ひらがな・ローマ字・生徒番号" aria-label="生徒検索"></div><button id="refresh" type="button" class="btn secondary">⟳ 最新情報を取得</button></div><p id="status" class="muted" role="status">読み込み中…</p><div id="candidates" class="candidates"></div></section><section id="detail" class="card hidden"></section></div>
</main>
<dialog id="zoom"><h2 id="zoomLabel"></h2><p id="zoomValue" style="font-size:1.6rem;overflow-wrap:anywhere;white-space:pre-wrap"></p><button class="btn" type="button" data-close="zoom">閉じる</button></dialog>
<dialog id="editor"><h2>☆マスタを編集</h2><p class="muted">数式の項目は変更できません。保存すると原本を書き換えます。</p><div id="editFields"></div><p id="editStatus" role="alert"></p><div class="actions"><button class="btn" id="save" type="button">変更を確認</button><button class="btn secondary" type="button" data-close="editor">キャンセル</button></div></dialog>
<script>
'use strict';
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const SHEET='https://docs.google.com/spreadsheets/d/1CIJkTlYUcUkbb8jBdFc6L8D5ubTGsxwNxFv01ten-Zk/edit#gid=829117795';
const TOKEN='adminSystemPortalSessionToken', EXPIRY='adminSystemPortalExpiresAt';
const INDEX_CACHE_KEY='stepStudentDirectorySearchIndexV1';
const LABELS={E:'生徒氏名',F:'フリガナ',H:'校舎',K:'学年',L:'生徒ログインPASS',M:'口座振替提出',N:'口座振替有効',P:'学校名',Q:'保護者氏名',R:'保護者フリガナ',S:'保護者続柄',T:'郵便番号',U:'住所（都道府県・市区町村）',V:'住所（番地）',W:'住所（建物名）',X:'保護者メール',Y:'保護者携帯',Z:'保護者自宅電話',AA:'第2保護者氏名',AB:'第2保護者フリガナ',AC:'第2保護者続柄',AE:'第2保護者携帯',AW:'成績パス'};
const el=id=>document.getElementById(id);
function statusBadge(flag){const value=String(flag??'').trim();if(value!=='0'&&value!=='')return null;const badge=document.createElement('span');badge.className='statusBadge '+(value===''?'withdrawn':'scheduled');badge.textContent=value===''?'退塾':'退塾予定';return badge}
let mode='personal',students=[],ready=false,selectedId='',editable=null,request=0,listRequest=0,listRefreshing=false;
function storage(){return localStorage}
function token(){return storage().getItem(TOKEN)||''}
function setStatus(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error)}
async function api(action,extra={}){const response=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...extra})});if(!response.ok)throw Error('通信に失敗しました。もう一度お試しください。');return response.json()}
function clearSession(){request++;listRequest++;localStorage.removeItem(INDEX_CACHE_KEY);for(const store of [localStorage,sessionStorage])for(const key of [TOKEN,EXPIRY,'adminLoggedIn','adminStaffCode','adminStaffName','adminDeviceMode'])store.removeItem(key);mode='';students=[];ready=false;editable=null;selectedId='';el('detail').replaceChildren();el('detail').classList.add('hidden')}
function showLogin(message=''){el('app').classList.add('hidden');el('logout').classList.add('hidden');el('login').classList.remove('hidden');el('loginError').textContent=message;el('password').value='';}
function showApp(){el('login').classList.add('hidden');el('app').classList.remove('hidden');el('logout').classList.remove('hidden');loadList()}
async function logout(){const t=token();clearSession();showLogin();if(t)api('logoutSystemPortal',{systemPortalSessionToken:t}).catch(()=>{})}
async function start(){if(!token()){showLogin();return}showApp()}
async function login(){const code=el('code').value.trim(),password=el('password').value;if(!code||!password){el('loginError').textContent='講師番号とパスワードを入力してください。';return}el('loginButton').disabled=true;el('loginError').textContent='確認しています…';try{const r=await api('staffLogin',{code,password});if(!r.success||!r.systemPortalSessionToken)throw Error(r.error||'この画面には管理権限が必要です。');const store=storage();store.setItem('adminDeviceMode',mode);store.setItem('adminLoggedIn','1');store.setItem('adminStaffCode',r.code||code);store.setItem('adminStaffName',r.name||'');store.setItem(TOKEN,r.systemPortalSessionToken);store.setItem(EXPIRY,r.systemPortalExpiresAt||'');el('password').value='';showApp()}catch(e){el('loginError').textContent=e.message}finally{el('loginButton').disabled=false}}
function normalize(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s　]+/g,'')}
const PAIRS = {
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'しゃ':'sha','しゅ':'shu','しょ':'sho','じゃ':'ja','じゅ':'ju','じょ':'jo',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo',
  'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
  'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo',
  'うぃ':'wi','うぇ':'we','うぉ':'wo','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo',
  'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','しぇ':'she','じぇ':'je','ちぇ':'che',
  'てぃ':'ti','でぃ':'di','とぅ':'tu','どぅ':'du','つぁ':'tsa','つぃ':'tsi','つぇ':'tse','つぉ':'tso'
};
const CHARS = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o',
  'ん':'n','ゔ':'vu','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゎ':'wa'
};
function romaji(v){const s=normalize(v);let result='',small=false;for(let i=0;i<s.length;i++){if(s[i]==='っ'){small=true;continue}if(s[i]==='ー'){result+=(result.match(/[aeiou]$/)||[''])[0];continue}const pair=PAIRS[s.slice(i,i+2)],part=pair||CHARS[s[i]]||s[i];if(pair)i++;if(small&&/^[bcdfghjklmpqrstvwxyz]/.test(part))result+=part.startsWith('ch')?'t':part[0];small=false;result+=part}return result}
function readCachedIndex(){
  try{const cache=JSON.parse(localStorage.getItem(INDEX_CACHE_KEY)||'null');if(!cache||cache.staffCode!==localStorage.getItem('adminStaffCode')||Date.now()-cache.time>7*86400000||!Array.isArray(cache.students))return [];return cache.students.filter(s=>s&&/^\d+$/.test(String(s.id))&&typeof s.name==='string')}
  catch{return []}
}
function saveCachedIndex(list){
  try{localStorage.setItem(INDEX_CACHE_KEY,JSON.stringify({staffCode:localStorage.getItem('adminStaffCode'),time:Date.now(),students:list.map(s=>({id:s.id,flag:s.flag,name:s.name,kana:s.kana,campus:s.campus,grade:s.grade}))}))}catch{}
}
async function fastIndex(seq){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3500);
  try{
    const response=await fetch(MEETING_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'getStudentList',token:token(),limit:1000}),cache:'no-store',signal:controller.signal});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true||!Array.isArray(data.students)||!data.students.length)return;
    if(seq!==listRequest||!token())return;
    students=data.students.map(s=>({id:String(s.id),flag:String(s.flag??''),name:String(s.name||''),kana:String(s.kana||s.nameKana||''),campus:String(s.campus||''),grade:String(s.grade||'')}));
    ready=true;renderCandidates();
  }finally{clearTimeout(timer)}
}
async function loadList(){
  const seq=++listRequest;request++;editable=null;selectedId='';el('detail').classList.add('hidden');
  const cached=readCachedIndex();students=cached;ready=!!cached.length;listRefreshing=true;el('refresh').disabled=true;
  if(ready)renderCandidates();else{el('candidates').replaceChildren();setStatus('生徒の検索候補を準備しています…')}
  if(!ready){try{await fastIndex(seq)}catch{} if(seq!==listRequest)return}
  if(!ready)setStatus('生徒マスタから最新の候補を取得しています…');
  try{
    const r=await api('getStudentDirectoryList',{systemPortalSessionToken:token()});
    if(seq!==listRequest)return;
    if(!r.success)throw Error(r.error||'取得できませんでした。');
    if(!Array.isArray(r.students)||!r.students.length)throw Error('原本から生徒を取得できませんでした。');
    students=r.students;ready=true;saveCachedIndex(students);
  }catch(e){
    if(seq!==listRequest)return;
    if(/ログイン情報|ログインしてください|管理権限/.test(e.message)){clearSession();showLogin('再ログインしてください。');return}
    listRefreshing=false;
    if(ready){renderCandidates();setStatus('候補は表示中です。原本の最新情報は取得できませんでした。更新ボタンで再取得してください。',true)}
    else setStatus('一覧を取得できませんでした：'+e.message,true);
    return;
  }finally{if(seq===listRequest)el('refresh').disabled=false}
  if(seq!==listRequest)return;listRefreshing=false;renderCandidates();
}
function renderCandidates(){if(!ready)return;const updating=listRefreshing?' ／ 原本の最新情報を確認中…':'';const q=normalize(el('search').value);const box=el('candidates');box.replaceChildren();if(!q){setStatus(`${students.length}人を読み込みました。名前・かな・ローマ字・番号を入力してください。${updating}`);return}const matches=students.filter(s=>[s.id,s.name,s.kana,romaji(s.kana)].some(v=>normalize(v).includes(q)));setStatus(matches.length?`${matches.length}人が該当します。生徒を選んでください。${updating}`:`「${el('search').value}」に一致する生徒はいません。${updating}`);for(const s of matches.slice(0,40)){const b=document.createElement('button');b.type='button';b.className='candidate';const name=document.createElement('strong');name.textContent=`${s.name}（${s.kana||'フリガナなし'}）`;const line=document.createElement('small');line.textContent=`No.${s.id} `;const candidateStatus=statusBadge(s.flag);if(candidateStatus)line.append(candidateStatus);line.append(document.createTextNode(` ／ ${s.grade||''} ／ ${s.campus||''}`));const badge=document.createElement('span');badge.className='candidateBadge';badge.textContent='✦';badge.setAttribute('aria-hidden','true');const inner=document.createElement('span');inner.className='candidateText';inner.append(name,line);const arrow=document.createElement('span');arrow.className='candidateArrow';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');b.append(badge,inner,arrow);b.addEventListener('click',()=>loadDetail(s.id));box.append(b)}if(matches.length>40)setStatus(`${matches.length}人が該当します。先頭40人を表示しています。`)}
function field(parent,label,value,opts={}){const wrap=document.createElement('div'),b=document.createElement('button');b.type='button';b.className='field'+(opts.big?' big':'')+(opts.small?' small':'');const l=document.createElement('span'),v=document.createElement('span');l.className='label';l.textContent=label;v.className='value';const shown=String(value??'').trim()||'未入力';v.textContent=opts.secret&&shown!=='未入力'?'••••（タップして確認）':shown;b.append(l,v);b.onclick=()=>{el('zoomLabel').textContent=label;el('zoomValue').textContent=shown;el('zoom').showModal()};wrap.append(b);if(opts.phone&&shown!=='未入力'){const digits=shown.replace(/[^+0-9]/g,'');if(/^\+?\d{9,15}$/.test(digits)){const a=document.createElement('a');a.href='tel:'+digits;a.className='phone';a.textContent='📞 電話をかける';wrap.append(a)}}parent.append(wrap)}
function section(parent,title,values,opts={}){const h=document.createElement('h3');h.textContent=title;parent.append(h);const grid=document.createElement('div');grid.className='grid';values.forEach(([label,value,extra])=>field(grid,label,value,{...opts,...extra}));parent.append(grid)}
async function loadDetail(id){const seq=++request;selectedId='';editable=null;el('detail').classList.remove('hidden');el('detail').textContent='生徒情報と時間割を取得しています…';try{const r=await api('getStudentDirectoryDetail',{studentId:id,systemPortalSessionToken:token()});if(seq!==request)return;if(!r.success||String(r.student?.id)!==String(id))throw Error(r.error||'取得できませんでした。');selectedId=id;editable=r.editable;renderDetail(r.student)}catch(e){if(seq===request)el('detail').textContent='詳細を取得できませんでした：'+e.message}}
function renderDetail(s){const card=el('detail');card.replaceChildren();const title=document.createElement('h2');title.append(document.createTextNode(`${s.name||'氏名未入力'}　No.${s.id}`));const enrollment=statusBadge(s.flag);if(enrollment)title.append(enrollment);const detailTop=document.createElement('div');detailTop.className='detailTop';const topGrades=document.createElement('a');topGrades.className='btn small detailGrades';topGrades.href=`admin.html?studentId=${encodeURIComponent(s.id)}#compare`;topGrades.textContent='📊 この生徒の成績を見る';detailTop.append(title,topGrades);card.append(detailTop);section(card,'基本情報',[['生徒氏名',s.name],['フリガナ',s.kana],['学年',s.grade],['学校名',s.school]],{big:true});section(card,'連絡先',[['保護者携帯',s.guardianPhone,{phone:true}],['保護者自宅電話',s.homePhone,{phone:true}],['第2保護者携帯',s.secondPhone,{phone:true}]],{big:true});renderMeetingSection(card,s.id);const h=document.createElement('h3');h.textContent='通塾時間割';card.append(h);if(s.lessons?.length){for(const v of s.lessons){const p=document.createElement('div');p.className='lesson';p.textContent=`${v.weekday} ${v.time} ${v.subject}`;card.append(p)}}else{const p=document.createElement('p');p.className='muted';p.textContent='登録されている授業枠はありません。';card.append(p)}if(s.course||s.options||s.note)section(card,'コース・備考',[['コース・オプション',[s.course,s.options].filter(Boolean).join('＋')],['時間割の備考',s.note]],{small:true});section(card,'その他の情報（タップで拡大）',[['保護者氏名',s.guardian],['第2保護者氏名',s.secondGuardian],['郵便番号',s.postcode],['住所',s.address],['保護者メール',s.guardianEmail],['第2保護者メール',s.secondEmail],['口座振替提出（M列）',s.debitSubmitted],['口座振替有効（N列）',s.debitEnabled],['生徒ログインPASS（L列）',s.loginPassword,{secret:true}],['成績パス（AW列）',s.gradePassword,{secret:true}]],{small:true});const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn';edit.type='button';edit.textContent='✏️ 生徒マスタを編集';edit.onclick=openEditor;const sheet=document.createElement('a');sheet.className='btn secondary';sheet.href=SHEET;sheet.target='_blank';sheet.rel='noopener';sheet.textContent='時間割の変更はシートへ';const grades=document.createElement('a');grades.className='btn secondary';grades.href=`admin.html?studentId=${encodeURIComponent(s.id)}#compare`;grades.textContent='📊 この生徒の成績を見る';actions.append(edit,sheet,grades);card.append(actions)}
const MEETING_API='https://wisedgcgwaebtkprdhth.supabase.co/functions/v1/seiseki-admin-runtime-v1';
function meetingDate(value){const raw=String(value||'');if(/^\d{4}-\d{2}-\d{2}/.test(raw))return raw.slice(0,10);const d=new Date(raw);return Number.isNaN(d.valueOf())?raw:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderMeetingSection(card,id){
  const head=document.createElement('div');head.className='meetingHead';
  const title=document.createElement('h3');title.textContent='🗒️ 面談記録';
  const add=document.createElement('a');add.href='admin.html#meetings';add.className='btn secondary small';add.textContent='＋ 面談メモを登録';
  head.append(title,add);card.append(head);
  const area=document.createElement('div');area.className='meetingStatus';area.textContent='面談記録を読み込み中…';card.append(area);
  loadMeetingRecords(id,area);
}
async function loadMeetingRecords(id,area){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch(MEETING_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'getMeetingMemos',studentId:String(id),token:token()}),cache:'no-store',signal:controller.signal});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true)throw Error(data.error||(response.status===401||response.status===403?'ログインし直してください。':'面談記録を取得できませんでした。'));
    if(selectedId!==id||!area.isConnected)return;
    area.replaceChildren();area.className='';
    const memos=(Array.isArray(data.memos)?data.memos:[]).filter(m=>String(m.studentId)===String(id)).sort((a,b)=>Date.parse(b.date||0)-Date.parse(a.date||0)||Date.parse(b.updatedAt||0)-Date.parse(a.updatedAt||0));
    if(!memos.length){area.className='meetingStatus';area.textContent='この生徒の面談記録はまだありません。';return}
    const count=document.createElement('p');count.className='muted';count.textContent=`${memos.length}件の面談記録（新しい順）`;area.append(count);
    for(const memo of memos){
      const article=document.createElement('article');article.className='meetingMemo';
      const meta=document.createElement('div');meta.className='meetingMeta';meta.textContent=`${meetingDate(memo.date)}　相手: ${memo.counterpart||'-'}　担当: ${memo.staff||'-'}`;
      const content=document.createElement('div');content.className='meetingContent';content.textContent=memo.content||'';
      article.append(meta,content);area.append(article);
    }
  }catch(e){if(selectedId!==id||!area.isConnected)return;area.replaceChildren();area.className='meetingStatus error';area.append(document.createTextNode('面談記録を読み込めませんでした：'+(e.name==='AbortError'?'時間がかかっています。':e.message)+' '));const retry=document.createElement('button');retry.type='button';retry.className='btn secondary small';retry.textContent='再取得';retry.onclick=()=>{area.className='meetingStatus';area.textContent='面談記録を読み込み中…';loadMeetingRecords(id,area)};area.append(retry)}finally{clearTimeout(timer)}
}
function openEditor(){if(!selectedId||!editable)return;const body=el('editFields');body.replaceChildren();for(const [letter,label] of Object.entries(LABELS)){const source=editable[letter];if(!source||source.formula)continue;const wrap=document.createElement('label');wrap.className='edit-field';wrap.textContent=`${label}（${letter}列）`;const input=document.createElement('input');input.dataset.letter=letter;input.type=['L','AW'].includes(letter)?'password':'text';input.autocomplete='off';input.value=source.value||'';wrap.append(input);body.append(wrap)}el('editStatus').textContent='';el('editor').showModal()}
async function save(){const changes={},lines=[];for(const input of el('editFields').querySelectorAll('input')){const letter=input.dataset.letter,before=editable[letter].value||'',after=input.value;if(before===after)continue;changes[letter]={before,after};lines.push(`${LABELS[letter]}：${['L','AW'].includes(letter)?'（変更前後の値は非表示）':`「${before||'空欄'}」→「${after||'空欄'}」`}`)}if(!lines.length){el('editStatus').textContent='変更はありません。';return}if(!confirm(`本当に☆マスタを書き換えますか？\n生徒番号：${selectedId}\n\n${lines.join('\n')}`))return;el('save').disabled=true;el('editStatus').textContent='原本に保存しています…';try{const id=selectedId,r=await api('saveStudentDirectory',{studentId:id,changes,systemPortalSessionToken:token()});if(!r.success)throw Error(r.error||'保存できませんでした。');el('editor').close();await loadDetail(id);setStatus('☆マスタへ保存し、最新の内容を読み直しました。')}catch(e){el('editStatus').textContent=e.message}finally{el('save').disabled=false}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());el('loginButton').onclick=login;el('password').onkeydown=e=>{if(e.key==='Enter')login()};el('refresh').onclick=loadList;el('search').oninput=renderCandidates;el('save').onclick=save;el('logout').onclick=()=>logout();start();
</script>
