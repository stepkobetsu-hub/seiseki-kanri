<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生徒情報検索 | 個別指導STEP</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#183148;background:#f0f5f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}header{background:#155343;color:white;padding:18px max(16px,calc((100vw - 1040px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.35rem;margin:0}h2{font-size:1.2rem;margin:0 0 14px}h3{font-size:1rem;margin:25px 0 9px}.sub{font-size:.8rem;opacity:.85}main{max-width:1040px;margin:22px auto;padding:0 16px 50px}.card{background:white;border:1px solid #dbe6eb;border-radius:14px;box-shadow:0 4px 16px #14364b0b;padding:20px;margin-bottom:16px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.search{width:min(100%,520px);font-size:1.12rem;padding:12px 14px;border:2px solid #a6bdc8;border-radius:9px}.search:focus,input:focus{outline:2px solid #328369;outline-offset:1px}.btn{border:1px solid #25735a;background:#25735a;color:white;padding:10px 15px;border-radius:9px;font-weight:650;text-decoration:none;display:inline-block}.btn.secondary{background:white;color:#175443}.btn.small{padding:6px 10px;font-size:.8rem}.muted{color:#627683;font-size:.85rem}.error{color:#ad2a32}#status{min-height:1.5em;margin:12px 0}.candidates{max-height:370px;overflow:auto;border-radius:9px}.candidate{display:block;width:100%;text-align:left;padding:12px 14px;background:#fff;border:0;border-bottom:1px solid #e3eaef}.candidate:hover,.candidate:focus{background:#ebf7f0}.candidate strong{font-size:1.06rem}.candidate small{color:#607381;display:block;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px}.field{background:#f8fafb;border:1px solid #dce7eb;border-radius:9px;padding:12px;text-align:left;overflow-wrap:anywhere;width:100%}.field.big{background:#f0f9f4}.field .label{display:block;font-size:.76rem;color:#607580;margin-bottom:5px}.field .value{font-size:1.16rem;font-weight:680;white-space:pre-wrap}.field.small .value{font-size:.9rem;font-weight:500}.phone{display:inline-block;color:#12634c;margin:4px 0 10px 8px}.lesson{padding:11px 13px;background:#f2f8f5;border-left:4px solid #278165;border-radius:6px;margin:7px 0;font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}dialog{border:0;border-radius:14px;width:min(650px,95vw);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 70px #001b2d55}dialog::backdrop{background:#0c233b77}.edit-field{display:block;margin:12px 0;font-weight:600}.edit-field input{display:block;width:100%;padding:10px;border:1px solid #b5c7ce;border-radius:7px;margin-top:5px}.login{max-width:440px;margin:65px auto}.login input{width:100%;padding:12px;border:1px solid #b4c6cc;border-radius:8px;margin:6px 0 13px}.device{display:flex;gap:8px;margin:13px 0}.device button{flex:1;background:white;color:#185742;border:1px solid #98b7a6;border-radius:8px;padding:10px}.device button.selected{background:#e4f5eb;border:2px solid #25735a}.hidden{display:none!important}@media(max-width:600px){header{padding:14px 16px;align-items:flex-start}.card{padding:15px}.login{margin:26px auto}.grid{grid-template-columns:1fr 1fr}.field .value{font-size:1rem}.field.small .value{font-size:.83rem}}
</style>
</head>
<body>
<header><div><h1>🔎 生徒情報検索</h1><div class="sub">個別指導STEP · 生徒マスタ</div></div><button id="logout" class="btn small secondary hidden" type="button">ログアウト</button></header>
<main>
 <section id="login" class="card login hidden"><h2>管理者ログイン</h2><p class="muted">成績管理と同じ管理者ID・パスワードを使用します。初回のログイン後は、ログアウトするまで保持します。</p><label>講師番号<input id="code" autocomplete="username" inputmode="numeric"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton" class="btn" type="button">ログイン</button><p id="loginError" class="error" role="alert"></p></section>
 <div id="app" class="hidden"><section class="card"><h2>生徒を探す</h2><div class="row"><input id="search" class="search" type="search" autocomplete="off" placeholder="名前・ひらがな・ローマ字・生徒番号" aria-label="生徒検索"><button id="refresh" type="button" class="btn secondary">最新情報を取得</button></div><p id="status" class="muted" role="status">読み込み中…</p><div id="candidates" class="candidates"></div></section><section id="detail" class="card hidden"></section></div>
</main>
<dialog id="zoom"><h2 id="zoomLabel"></h2><p id="zoomValue" style="font-size:1.6rem;overflow-wrap:anywhere;white-space:pre-wrap"></p><button class="btn" type="button" data-close="zoom">閉じる</button></dialog>
<dialog id="editor"><h2>☆マスタを編集</h2><p class="muted">数式の項目は変更できません。保存すると原本を書き換えます。</p><div id="editFields"></div><p id="editStatus" role="alert"></p><div class="actions"><button class="btn" id="save" type="button">変更を確認</button><button class="btn secondary" type="button" data-close="editor">キャンセル</button></div></dialog>
<script>
'use strict';
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const SHEET='https://docs.google.com/spreadsheets/d/1CIJkTlYUcUkbb8jBdFc6L8D5ubTGsxwNxFv01ten-Zk/edit#gid=829117795';
const TOKEN='adminSystemPortalSessionToken', EXPIRY='adminSystemPortalExpiresAt';
const LABELS={E:'生徒氏名',F:'フリガナ',H:'校舎',K:'学年',L:'生徒ログインPASS',M:'口座振替提出',N:'口座振替有効',P:'学校名',Q:'保護者氏名',R:'保護者フリガナ',S:'保護者続柄',T:'郵便番号',U:'住所（都道府県・市区町村）',V:'住所（番地）',W:'住所（建物名）',X:'保護者メール',Y:'保護者携帯',Z:'保護者自宅電話',AA:'第2保護者氏名',AB:'第2保護者フリガナ',AC:'第2保護者続柄',AE:'第2保護者携帯',AW:'成績パス'};
const el=id=>document.getElementById(id);
let mode='personal',students=[],ready=false,selectedId='',editable=null,request=0;
function storage(){return localStorage}
function token(){return storage().getItem(TOKEN)||''}
function setStatus(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error)}
async function api(action,extra={}){const response=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...extra})});if(!response.ok)throw Error('通信に失敗しました。もう一度お試しください。');return response.json()}
function clearSession(){for(const store of [localStorage,sessionStorage])for(const key of [TOKEN,EXPIRY,'adminLoggedIn','adminStaffCode','adminStaffName','adminDeviceMode'])store.removeItem(key);mode='';students=[];ready=false;editable=null;selectedId='';el('detail').replaceChildren();el('detail').classList.add('hidden')}
function showLogin(message=''){el('app').classList.add('hidden');el('logout').classList.add('hidden');el('login').classList.remove('hidden');el('loginError').textContent=message;el('password').value='';}
function showApp(){el('login').classList.add('hidden');el('app').classList.remove('hidden');el('logout').classList.remove('hidden');loadList()}
async function logout(){const t=token();clearSession();showLogin();if(t)api('logoutSystemPortal',{systemPortalSessionToken:t}).catch(()=>{})}
async function start(){if(!token()){showLogin();return}el('app').classList.remove('hidden');setStatus('ログイン状態を確認しています…');try{const r=await api('verifySystemPortal',{systemPortalSessionToken:token()});if(!r.success)throw Error(r.error||'再ログインしてください。');showApp()}catch(e){clearSession();showLogin(e.message)}}
async function login(){const code=el('code').value.trim(),password=el('password').value;if(!code||!password){el('loginError').textContent='講師番号とパスワードを入力してください。';return}el('loginButton').disabled=true;el('loginError').textContent='確認しています…';try{const r=await api('staffLogin',{code,password});if(!r.success||!r.systemPortalSessionToken)throw Error(r.error||'この画面には管理権限が必要です。');const store=storage();store.setItem('adminDeviceMode',mode);store.setItem('adminLoggedIn','1');store.setItem('adminStaffCode',r.code||code);store.setItem('adminStaffName',r.name||'');store.setItem(TOKEN,r.systemPortalSessionToken);store.setItem(EXPIRY,r.systemPortalExpiresAt||'');el('password').value='';showApp()}catch(e){el('loginError').textContent=e.message}finally{el('loginButton').disabled=false}}
function normalize(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s　]+/g,'')}
const PAIRS = {
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'しゃ':'sha','しゅ':'shu','しょ':'sho','じゃ':'ja','じゅ':'ju','じょ':'jo',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo',
  'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
  'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo',
  'うぃ':'wi','うぇ':'we','うぉ':'wo','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo',
  'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','しぇ':'she','じぇ':'je','ちぇ':'che',
  'てぃ':'ti','でぃ':'di','とぅ':'tu','どぅ':'du','つぁ':'tsa','つぃ':'tsi','つぇ':'tse','つぉ':'tso'
};
const CHARS = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o',
  'ん':'n','ゔ':'vu','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゎ':'wa'
};
function romaji(v){const s=normalize(v);let result='',small=false;for(let i=0;i<s.length;i++){if(s[i]==='っ'){small=true;continue}if(s[i]==='ー'){result+=(result.match(/[aeiou]$/)||[''])[0];continue}const pair=PAIRS[s.slice(i,i+2)],part=pair||CHARS[s[i]]||s[i];if(pair)i++;if(small&&/^[bcdfghjklmpqrstvwxyz]/.test(part))result+=part.startsWith('ch')?'t':part[0];small=false;result+=part}return result}
async function loadList(){const seq=++request;students=[];ready=false;editable=null;selectedId='';el('detail').classList.add('hidden');el('candidates').replaceChildren();setStatus('生徒マスタから読み込み中… 検索結果は読み込み後に表示します。');el('refresh').disabled=true;try{const r=await api('getStudentDirectoryList',{systemPortalSessionToken:token()});if(seq!==request)return;if(!r.success)throw Error(r.error||'読み込めませんでした。');students=r.students||[];if(!students.length)throw Error('原本から生徒を取得できませんでした。最新情報を取得し直してください。');ready=true;renderCandidates()}catch(e){if(seq!==request)return;setStatus('一覧を取得できませんでした：'+e.message,true)}finally{if(seq===request)el('refresh').disabled=false}}
function renderCandidates(){if(!ready)return;const q=normalize(el('search').value);const box=el('candidates');box.replaceChildren();if(!q){setStatus(`${students.length}人を読み込みました。名前・かな・ローマ字・番号を入力してください。`);return}const matches=students.filter(s=>[s.id,s.name,s.kana,romaji(s.kana)].some(v=>normalize(v).includes(q)));setStatus(matches.length?`${matches.length}人が該当します。生徒を選んでください。`:`「${el('search').value}」に一致する生徒はいません。`);for(const s of matches.slice(0,40)){const b=document.createElement('button');b.type='button';b.className='candidate';const name=document.createElement('strong');name.textContent=`${s.name}（${s.kana||'フリガナなし'}）`;const line=document.createElement('small');line.textContent=`No.${s.id} ／ ${s.grade||''} ／ ${s.campus||''}`;b.append(name,line);b.addEventListener('click',()=>loadDetail(s.id));box.append(b)}if(matches.length>40)setStatus(`${matches.length}人が該当します。先頭40人を表示しています。`)}
function field(parent,label,value,opts={}){const wrap=document.createElement('div'),b=document.createElement('button');b.type='button';b.className='field'+(opts.big?' big':'')+(opts.small?' small':'');const l=document.createElement('span'),v=document.createElement('span');l.className='label';l.textContent=label;v.className='value';const shown=String(value??'').trim()||'未入力';v.textContent=opts.secret&&shown!=='未入力'?'••••（タップして確認）':shown;b.append(l,v);b.onclick=()=>{el('zoomLabel').textContent=label;el('zoomValue').textContent=shown;el('zoom').showModal()};wrap.append(b);if(opts.phone&&shown!=='未入力'){const digits=shown.replace(/[^+0-9]/g,'');if(/^\+?\d{9,15}$/.test(digits)){const a=document.createElement('a');a.href='tel:'+digits;a.className='phone';a.textContent='📞 電話をかける';wrap.append(a)}}parent.append(wrap)}
function section(parent,title,values,opts={}){const h=document.createElement('h3');h.textContent=title;parent.append(h);const grid=document.createElement('div');grid.className='grid';values.forEach(([label,value,extra])=>field(grid,label,value,{...opts,...extra}));parent.append(grid)}
async function loadDetail(id){const seq=++request;selectedId='';editable=null;el('detail').classList.remove('hidden');el('detail').textContent='生徒情報と時間割を取得しています…';try{const r=await api('getStudentDirectoryDetail',{studentId:id,systemPortalSessionToken:token()});if(seq!==request)return;if(!r.success||String(r.student?.id)!==String(id))throw Error(r.error||'取得できませんでした。');selectedId=id;editable=r.editable;renderDetail(r.student)}catch(e){if(seq===request)el('detail').textContent='詳細を取得できませんでした：'+e.message}}
function renderDetail(s){const card=el('detail');card.replaceChildren();const title=document.createElement('h2');title.textContent=`${s.name||'氏名未入力'}　No.${s.id}`;card.append(title);section(card,'基本情報',[['生徒氏名',s.name],['フリガナ',s.kana],['学年',s.grade],['学校名',s.school]],{big:true});section(card,'連絡先',[['保護者携帯',s.guardianPhone,{phone:true}],['保護者自宅電話',s.homePhone,{phone:true}],['第2保護者携帯',s.secondPhone,{phone:true}]],{big:true});const h=document.createElement('h3');h.textContent='通塾時間割';card.append(h);if(s.lessons?.length){for(const v of s.lessons){const p=document.createElement('div');p.className='lesson';p.textContent=`${v.weekday} ${v.time} ${v.subject}`;card.append(p)}}else{const p=document.createElement('p');p.className='muted';p.textContent='登録されている授業枠はありません。';card.append(p)}if(s.course||s.options||s.note)section(card,'コース・備考',[['コース・オプション',[s.course,s.options].filter(Boolean).join('＋')],['時間割の備考',s.note]],{small:true});section(card,'その他の情報（タップで拡大）',[['保護者氏名',s.guardian],['第2保護者氏名',s.secondGuardian],['郵便番号',s.postcode],['住所',s.address],['保護者メール',s.guardianEmail],['第2保護者メール',s.secondEmail],['口座振替提出（M列）',s.debitSubmitted],['口座振替有効（N列）',s.debitEnabled],['生徒ログインPASS（L列）',s.loginPassword,{secret:true}],['成績パス（AW列）',s.gradePassword,{secret:true}]],{small:true});const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn';edit.type='button';edit.textContent='✏️ 生徒マスタを編集';edit.onclick=openEditor;const sheet=document.createElement('a');sheet.className='btn secondary';sheet.href=SHEET;sheet.target='_blank';sheet.rel='noopener';sheet.textContent='時間割の変更はシートへ';const grades=document.createElement('a');grades.className='btn secondary';grades.href=`admin.html?studentId=${encodeURIComponent(s.id)}#compare`;grades.textContent='📊 この生徒の成績を見る';actions.append(edit,sheet,grades);card.append(actions)}
function openEditor(){if(!selectedId||!editable)return;const body=el('editFields');body.replaceChildren();for(const [letter,label] of Object.entries(LABELS)){const source=editable[letter];if(!source||source.formula)continue;const wrap=document.createElement('label');wrap.className='edit-field';wrap.textContent=`${label}（${letter}列）`;const input=document.createElement('input');input.dataset.letter=letter;input.type=['L','AW'].includes(letter)?'password':'text';input.autocomplete='off';input.value=source.value||'';wrap.append(input);body.append(wrap)}el('editStatus').textContent='';el('editor').showModal()}
async function save(){const changes={},lines=[];for(const input of el('editFields').querySelectorAll('input')){const letter=input.dataset.letter,before=editable[letter].value||'',after=input.value;if(before===after)continue;changes[letter]={before,after};lines.push(`${LABELS[letter]}：${['L','AW'].includes(letter)?'（変更前後の値は非表示）':`「${before||'空欄'}」→「${after||'空欄'}」`}`)}if(!lines.length){el('editStatus').textContent='変更はありません。';return}if(!confirm(`本当に☆マスタを書き換えますか？\n生徒番号：${selectedId}\n\n${lines.join('\n')}`))return;el('save').disabled=true;el('editStatus').textContent='原本に保存しています…';try{const id=selectedId,r=await api('saveStudentDirectory',{studentId:id,changes,systemPortalSessionToken:token()});if(!r.success)throw Error(r.error||'保存できませんでした。');el('editor').close();await loadDetail(id);setStatus('☆マスタへ保存し、最新の内容を読み直しました。')}catch(e){el('editStatus').textContent=e.message}finally{el('save').disabled=false}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());el('loginButton').onclick=login;el('password').onkeydown=e=>{if(e.key==='Enter')login()};el('refresh').onclick=loadList;el('search').oninput=renderCandidates;el('save').onclick=save;el('logout').onclick=()=>logout();start();
</script>
</body>
</html>
