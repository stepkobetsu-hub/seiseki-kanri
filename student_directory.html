<body>
<header><div class="brand"><span class="brandIcon" aria-hidden="true">🔎</span><div><h1>生徒情報検索</h1><div class="sub">個別指導STEP · 生徒マスタ</div></div></div><div class="row"><button id="editorLogout" class="btn small secondary hidden" type="button">編集用ログアウト</button><button id="logout" class="btn small secondary hidden" type="button">ログアウト</button></div></header>
<main>
 <section id="login" class="card login hidden"><h2>管理者ログイン</h2><p class="muted">成績管理と同じ管理者ID・パスワードを使用します。初回のログイン後は、ログアウトするまで保持します。</p><label>講師番号<input id="code" autocomplete="username" inputmode="numeric"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton" class="btn" type="button">ログイン</button><p id="loginError" class="error" role="alert"></p></section>
 <div id="app" class="hidden"><section class="card searchCard"><div class="searchTitle"><span class="searchTitleIcon" aria-hidden="true">🌱</span><div><h2>生徒を探す</h2><p>名前や生徒番号を入力すると、すぐに候補が表示されます。</p></div></div><div class="row searchRow"><div class="searchWrap"><span class="searchWrapIcon" aria-hidden="true">🔍</span><input id="search" class="search" type="search" autocomplete="off" placeholder="名前・ひらがな・ローマ字・生徒番号" aria-label="生徒検索"></div><button id="refresh" type="button" class="btn secondary">⟳ 最新情報を取得</button></div><p id="status" class="muted" role="status">読み込み中…</p><div id="candidates" class="candidates"></div></section><section id="detail" class="card hidden"></section></div>
</main>
<dialog id="zoom"><h2 id="zoomLabel"></h2><p id="zoomValue" style="font-size:1.6rem;overflow-wrap:anywhere;white-space:pre-wrap"></p><button class="btn" type="button" data-close="zoom">閉じる</button></dialog>

<dialog id="editorLogin"><h2>生徒マスタ保存用ログイン</h2><p class="muted">保存には権限4のID・パスワードが必要です。この端末ではログアウトするまで保持します。</p><label>ID（講師番号）<input id="editorLoginCode" autocomplete="username" inputmode="numeric"></label><label>パスワード<input id="editorLoginPassword" type="password" autocomplete="current-password"></label><p id="editorLoginError" class="error" role="alert"></p><div class="actions"><button id="editorLoginSubmit" class="btn" type="button">ログインして保存へ進む</button><button id="editorLoginCancel" class="btn secondary" type="button">キャンセル</button></div></dialog>

<script>
'use strict';
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';

const TOKEN='adminSystemPortalSessionToken', EXPIRY='adminSystemPortalExpiresAt';
const EDITOR_TOKEN='stepDirectoryEditorTokenV1';
let editorLoginResolve=null,editorLoginPromise=null,editorLoginSequence=0;
function editorToken(){return localStorage.getItem(EDITOR_TOKEN)||''}

async function logoutEditor(){editorLoginSequence++;const t=editorToken();localStorage.removeItem(EDITOR_TOKEN);updateEditorSessionUI();el('editorLoginPassword').value='';if(editorLoginResolve){editorLoginResolve(null);editorLoginResolve=null;el('editorLogin').close()}if(t)await StepStaffAuth.logout(t).catch(()=>{});}

  const sequence=editorLoginSequence;el('editorLoginSubmit').disabled=true;el('editorLoginError').textContent='確認しています…';
  let issued='';
  try{
    const response=await StepStaffAuth.fetchRuntime({action:'staffLogin',code,password,permissionAppId:'student-directory'});
    const r=await response.json();if(!response.ok||!r.success)throw Error(r.error||'ID・パスワードを確認してください。');

    localStorage.setItem(EDITOR_TOKEN,issued);updateEditorSessionUI();el('editorLoginPassword').value='';el('editorLogin').close();
    const resolve=editorLoginResolve;editorLoginResolve=null;resolve(issued);
  }catch(error){if(issued)await StepStaffAuth.logout(issued).catch(()=>{});if(sequence===editorLoginSequence)el('editorLoginError').textContent=error.message}

}
function cancelEditorLogin(){editorLoginSequence++;el('editorLoginPassword').value='';el('editorLogin').close();if(editorLoginResolve){const resolve=editorLoginResolve;editorLoginResolve=null;resolve(null)}}
const INDEX_CACHE_KEY='stepStudentDirectorySearchIndexV1';
const LABELS={E:'生徒氏名',F:'フリガナ',H:'校舎',K:'学年',L:'パスワード',M:'口座振替提出',N:'口座振替有効',P:'学校名',Q:'保護者氏名',R:'保護者フリガナ',S:'保護者続柄',T:'郵便番号',U:'住所（都道府県・市区町村）',V:'住所（番地）',W:'住所（建物名）',X:'保護者メール',Y:'保護者携帯',Z:'保護者自宅電話',AA:'第2保護者氏名',AB:'第2保護者フリガナ',AC:'第2保護者続柄',AE:'第2保護者携帯'};
const el=id=>document.getElementById(id);
function statusBadge(flag){const value=String(flag??'').trim();if(value!=='0'&&value!=='')return null;const badge=document.createElement('span');badge.className='statusBadge '+(value===''?'withdrawn':'scheduled');badge.textContent=value===''?'退塾':'退塾予定';return badge}
let admissionIndexPromise=Promise.resolve();
let mode='personal',students=[],ready=false,selectedId='',editable=null,request=0,listRequest=0,listRefreshing=false,detailView=false;
function storage(){return localStorage}
function token(){return storage().getItem(TOKEN)||''}
function setStatus(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error)}
async function api(action,extra={},signal){const response=await fetch(GAS,{signal,method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...extra})});if(!response.ok)throw Error('通信に失敗しました。もう一度お試しください。');return response.json()}
function clearSession(){if(masterConfirmResolve)finishMasterConfirm(false);void logoutEditor();DirectoryAcademic.clear();sessionStorage.removeItem('stepDirectoryGradeProfilesV1');resetDetails();request++;listRequest++;localStorage.removeItem(INDEX_CACHE_KEY);for(const store of [localStorage,sessionStorage])for(const key of [TOKEN,EXPIRY,'adminLoggedIn','adminStaffCode','adminStaffName','adminDeviceMode'])store.removeItem(key);mode='';students=[];ready=false;editable=null;selectedId='';detailView=false;document.querySelector('.searchCard').classList.remove('viewingDetail');el('detail').replaceChildren();el('detail').classList.add('hidden')}
function showLogin(message=''){el('app').classList.add('hidden');el('logout').classList.add('hidden');el('login').classList.remove('hidden');el('loginError').textContent=message;el('password').value='';}
function showApp(){updateEditorSessionUI();el('login').classList.add('hidden');el('app').classList.remove('hidden');el('logout').classList.remove('hidden');loadList()}
async function logout(){const t=token();clearSession();showLogin();if(t)api('logoutSystemPortal',{systemPortalSessionToken:t}).catch(()=>{})}
async function start(){if(!token()){showLogin();return}showApp()}
async function login(){const code=el('code').value.trim(),password=el('password').value;if(!code||!password){el('loginError').textContent='講師番号とパスワードを入力してください。';return}el('loginButton').disabled=true;el('loginError').textContent='確認しています…';try{const r=await api('staffLogin',{code,password});if(!r.success||!r.systemPortalSessionToken)throw Error(r.error||'この画面には管理権限が必要です。');const store=storage();store.setItem('adminDeviceMode',mode);store.setItem('adminLoggedIn','1');store.setItem('adminStaffCode',r.code||code);store.setItem('adminStaffName',r.name||'');store.setItem(TOKEN,r.systemPortalSessionToken);store.setItem(EXPIRY,r.systemPortalExpiresAt||'');StepStaffAuth.persist(r.systemPortalSessionToken).then(()=>{if(token()===r.systemPortalSessionToken)store.setItem(EXPIRY,'2100-01-01T00:00:00.000Z')}).catch(()=>{});el('password').value='';showApp()}catch(e){el('loginError').textContent=e.message}finally{el('loginButton').disabled=false}}
function normalize(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s　]+/g,'')}
const PAIRS = {
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'しゃ':'sha','しゅ':'shu','しょ':'sho','じゃ':'ja','じゅ':'ju','じょ':'jo',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo',
  'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
  'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo',
  'うぃ':'wi','うぇ':'we','うぉ':'wo','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo',
  'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','しぇ':'she','じぇ':'je','ちぇ':'che',
  'てぃ':'ti','でぃ':'di','とぅ':'tu','どぅ':'du','つぁ':'tsa','つぃ':'tsi','つぇ':'tse','つぉ':'tso'
};
const CHARS = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o',
  'ん':'n','ゔ':'vu','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゎ':'wa'
};
function romaji(v){const s=normalize(v);let result='',small=false;for(let i=0;i<s.length;i++){if(s[i]==='っ'){small=true;continue}if(s[i]==='ー'){result+=(result.match(/[aeiou]$/)||[''])[0];continue}const pair=PAIRS[s.slice(i,i+2)],part=pair||CHARS[s[i]]||s[i];if(pair)i++;if(small&&/^[bcdfghjklmpqrstvwxyz]/.test(part))result+=part.startsWith('ch')?'t':part[0];small=false;result+=part}return result}
const SEARCH_KEYS=new WeakMap();
function searchKeys(student){
  let keys=SEARCH_KEYS.get(student);
  if(!keys){
    keys=[student.id,student.name,student.kana,romaji(student.kana)].map(normalize);
    SEARCH_KEYS.set(student,keys);
  }
  return keys;
}
function prepareSearch(list){list.forEach(searchKeys);return list}
function readCachedIndex(){
  try{const cache=JSON.parse(localStorage.getItem(INDEX_CACHE_KEY)||'null');if(!cache||cache.staffCode!==localStorage.getItem('adminStaffCode')||Date.now()-cache.time>7*86400000||!Array.isArray(cache.students))return [];return cache.students.filter(s=>s&&/^\d+$/.test(String(s.id))&&typeof s.name==='string')}
  catch{return []}
}
function saveCachedIndex(list){
  try{localStorage.setItem(INDEX_CACHE_KEY,JSON.stringify({staffCode:localStorage.getItem('adminStaffCode'),time:Date.now(),students:list.map(s=>({id:s.id,flag:s.flag,name:s.name,kana:s.kana,campus:s.campus,grade:s.grade,admissionDate:s.admissionDate||'',admissionDateText:s.admissionDateText||''}))}))}catch{}
}
async function fastIndex(seq){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
  try{
    const response=await StepStaffAuth.fetchRuntime({action:'getStudentList',permissionAppId:'student-directory',token:token(),limit:1000},controller.signal);
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true)throw Error(data.error||'DBの一覧を取得できませんでした。');
    if(!Array.isArray(data.students)||!data.students.length)return;
    if(seq!==listRequest||!token())return;
    students=prepareSearch(data.students.map(s=>({id:String(s.id),flag:String(s.flag??''),name:String(s.name||''),kana:String(s.kana||s.nameKana||''),campus:String(s.campus||''),grade:String(s.grade||''),admissionDate:String(s.admissionDate||''),admissionDateText:String(s.admissionDateText||'')})));

    saveCachedIndex(students);ready=true;if(!detailView)renderCandidates();
    else {
      const current=students.find(s=>String(s.id)===String(selectedId));
      if(current&&(current.admissionDate||current.admissionDateText)){
        const labels=el('detail').querySelectorAll('[data-admission-student-id]');

      }

async function loadList(){
  resetDetails();
  const seq=++listRequest;request++;editable=null;selectedId='';detailView=false;document.querySelector('.searchCard').classList.remove('viewingDetail');el('detail').classList.add('hidden');

  admissionIndexPromise=fastIndex(seq).catch(()=>{});
  if(ready){renderCandidates()}else{el('candidates').replaceChildren();setStatus('生徒の検索候補を準備しています…')}
    if(!ready)setStatus('生徒マスタから最新の候補を取得しています…');
  try{
    const r=await api('getStudentDirectoryList',{systemPortalSessionToken:token()});
    if(seq!==listRequest)return;
    if(!r.success)throw Error(r.error||'取得できませんでした。');
    if(!Array.isArray(r.students)||!r.students.length)throw Error('原本から生徒を取得できませんでした。');
    const admissionRows=students;
    students=prepareSearch(r.students.map(s=>{const saved=admissionRows.find(row=>String(row.id)===String(s.id));return {...s,admissionDate:s.admissionDate||saved?.admissionDate||'',admissionDateText:s.admissionDateText||saved?.admissionDateText||''}}));ready=true;saveCachedIndex(students);
  }catch(e){
    if(seq!==listRequest)return;

    // Only an explicit logout clears the shared personal browser session.
    listRefreshing=false;
    if(ready){renderCandidates();setStatus('候補は表示中です。原本の最新情報は取得できませんでした。更新ボタンで再取得してください。',true)}
    else setStatus('一覧を取得できませんでした：'+e.message,true);
    return;
  }finally{if(seq===listRequest)el('refresh').disabled=false}
  if(seq!==listRequest)return;listRefreshing=false;renderCandidates();

const detailCache=new Map(),detailPending=new Map();
let detailEpoch=0,prefetchTimer=0;
const DETAIL_REUSE_MS=300000;
// Detail data stays only in this page's memory, never in browser storage.
function resetDetails(){DirectoryEntry.clear();DirectoryAcademic.clear();detailEpoch++;clearTimeout(prefetchTimer);detailCache.clear();for(const entry of detailPending.values())entry.controller.abort();detailPending.clear()}
function validDetail(r,id){return r?.success===true&&String(r.student?.id)===String(id)}
async function directoryDetailRuntime_(id,signal){
  const payload={action:'getStudentDirectoryDetail',permissionAppId:'student-directory',token:token(),studentId:id};
  const endpoints=['https://wisedgcgwaebtkprdhth.supabase.co/functions/v1/seiseki-admin-runtime-v1','https://wisedgcgwaebtkprdhth.functions.supabase.co/seiseki-admin-runtime-v1'];
  const read=async url=>{
    const response=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),cache:'no-store',signal});
    const result=await response.json();
    if(!response.ok||!validDetail(result,id))throw Error(result.error||'生徒詳細を取得できませんでした。');

async function requestDetail(id){
  id=String(id);
  const session=token(),epoch=detailEpoch;
  if(!session)throw Error('ログインしてください。');
  const cached=detailCache.get(id);
  if(cached&&cached.session===session&&Date.now()-cached.at<DETAIL_REUSE_MS)return cached.data;
  detailCache.delete(id);
  const pending=detailPending.get(id);
  if(pending&&pending.session===session)return pending.promise;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
  const entry={session,promise:null,controller};
  // Both services authenticate the supplied session; use the first valid read.
  const checked=promise=>promise.then(r=>{if(!validDetail(r,id))throw Error(r.error||'取得できませんでした。');return r;});
  entry.promise=Promise.any([
    checked(directoryDetailRuntime_(id,controller.signal)),
    checked(api('getStudentDirectoryDetail',{studentId:id,systemPortalSessionToken:session},controller.signal))
  ]).catch(error=>{if(controller.signal.aborted)throw Error('通信に時間がかかっています。再取得してください。');throw Error(error.errors?.map(e=>e.message).join(' / ')||error.message)}).then(r=>{
    if(epoch!==detailEpoch||session!==token())throw Error('情報を更新しました。もう一度選択してください。');
    if(!validDetail(r,id))throw Error(r.error||'取得できませんでした。');
    detailCache.set(id,{session,at:Date.now(),data:r});
    while(detailCache.size>20)detailCache.delete(detailCache.keys().next().value);
    return r;
  }).catch(e=>{if(e.name==='AbortError')throw Error('通信に時間がかかっています。もう一度選択してください。');throw e}).finally(()=>{clearTimeout(timer);if(detailPending.get(id)===entry)detailPending.delete(id)});
  detailPending.set(id,entry);
  return entry.promise;
}
function prefetchDetails(matches){
  clearTimeout(prefetchTimer);
  if(!token()||document.hidden||!matches.length||matches.length>2)return;
  const ids=matches.map(s=>String(s.id)),epoch=detailEpoch;
  prefetchTimer=setTimeout(()=>{
    if(epoch!==detailEpoch||detailView)return;
    for(const id of ids){
      if(detailPending.size>=2&&!detailPending.has(id))break;
      requestDetail(id).catch(()=>{});
    }
  },200);
}
function showSavedDetail(id,r){
  resetDetails();
  if(!validDetail(r,id))return loadDetail(id);
  request++;selectedId=id;editable=r.editable;detailView=true;
  renderDetail(r.student);
}

async function loadDetail(id){
  const seq=++request,started=performance.now();id=String(id);
  const card=el('detail');card.dataset.loadState='loading';delete card.dataset.loadMs;
  selectedId=id;editable=null;detailView=true;
  document.querySelector('.searchCard').classList.add('viewingDetail');
  el('candidates').replaceChildren();card.classList.remove('hidden');
  const preview=students.find(s=>String(s.id)===id);
  if(preview)renderStudentPreview_(preview);else card.textContent='生徒情報と時間割を取得しています…';
  window.scrollTo({top:0,behavior:'instant'});
  try{
    const r=await requestDetail(id);if(seq!==request)return;
    if(!validDetail(r,id))throw Error(r.error||'取得できませんでした。');
    editable=r.editable;renderDetail(r.student);
    card.dataset.loadMs=String(Math.round(performance.now()-started));card.dataset.loadState='loaded';
  }catch(e){
    if(seq!==request)return;card.dataset.loadState='error';
    const status=el('detailFetchStatus')||card;
    status.textContent='連絡先・時間割の詳細を取得できませんでした：'+e.message;
    const retry=document.createElement('button');retry.type='button';retry.className='btn secondary';retry.textContent='詳細を再取得';retry.onclick=()=>loadDetail(id);status.append(retry);
  }
}

function normalizeDirectoryAdmission_(value){
  const raw=String(value||'').trim();if(!raw)return '';
  let year,month,day;
  const plain=raw.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})(?:日)?$/);
  if(plain){year=plain[1];month=plain[2].padStart(2,'0');day=plain[3].padStart(2,'0');}
  else {
    const date=new Date(raw);if(!Number.isFinite(date.getTime()))return '';
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
    const get=type=>parts.find(part=>part.type===type)?.value||'';
    year=get('year');month=get('month');day=get('day');
  }
  const result=year+'-'+month+'-'+day,check=new Date(result+'T00:00:00Z');
  return Number.isFinite(check.getTime())&&check.toISOString().slice(0,10)===result?result:'';
}
const admissionPending_=new Map();
async function fetchDirectoryAdmission_(id,signal){
  const session=token();
  const checkDate=(date,raw)=>{
    if(!date&&!raw){const error=Error('入塾日が未登録です。');error.noDate=true;throw error;}
    return {date:normalizeDirectoryAdmission_(date||raw),raw:String(raw||date||'')};
  };
  const db=async()=>{
    const result=await mirrorApi('getStudentList',{q:String(id),limit:10},signal);
    const row=result.students?.find(s=>String(s.id)===String(id));
    if(!result.success||!row)throw Error(result.error||'DBの入塾日を取得できませんでした。');
    return checkDate(row.admissionDate,row.admissionDateText);
  };
  const master=async()=>{
    // Reuse the server-authenticated detail for this exact student and session.
    const detail=await requestDetail(id);
    if(!validDetail(detail,id)||token()!==session)throw Error('ログイン情報が変わりました。');
    signal?.throwIfAborted();
    const result=await api('getEntrySheetData',{studentId:id,systemPortalSessionToken:session},signal);
    if(!result.success||String(result.data?.studentId)!==String(id)||!result.data?.masterInfo)throw Error(result.error||'生徒マスタの入塾日を取得できませんでした。');
    const raw=String(result.data.masterInfo.colC||'');
    if(!raw)return {date:'',raw:''}; // Confirmed blank in the authoritative master.
    return checkDate('',raw);
  };
  try{return await Promise.any([db(),master()]);}
  catch(error){
    if(error.errors?.length&&error.errors.every(e=>e.noDate))return {date:'',raw:''};
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    throw Error(error.errors?.map(e=>e.message).join(' / ')||error.message);
  }
}

async function loadDirectoryAdmission(id,label,student){
  if(String(selectedId)!==String(id)||!label.isConnected)return;
  const indexed=students.find(s=>String(s.id)===String(id));
  let date=String(student.admissionDate||indexed?.admissionDate||'');
  let raw=String(student.admissionDateText||indexed?.admissionDateText||'');

    try{

      const key=token()+':'+id;
      let pending=admissionPending_.get(key);
      if(!pending){pending=fetchDirectoryAdmission_(id,controller.signal);admissionPending_.set(key,pending);pending.finally(()=>{if(admissionPending_.get(key)===pending)admissionPending_.delete(key)}).catch(()=>{});}
      const result=await pending;
      if(String(selectedId)!==String(id)||!label.isConnected)return;
      date=result.date;raw=result.raw;
      student.admissionDate=date;student.admissionDateText=raw;

      const cached=detailCache.get(String(id));if(cached){cached.data.student.admissionDate=date;cached.data.student.admissionDateText=raw;}

      const retry=document.createElement('button');retry.type='button';retry.className='btn secondary small';retry.textContent='再取得';
      retry.onclick=()=>{label.replaceChildren();loadDirectoryAdmission(id,label,student)};label.append(retry);

      return;
    }finally{clearTimeout(timer)}
  }
  const duration=calcEnrollmentDuration(date);
  const text=date?'入塾日: '+date+(duration?'（'+duration+'通塾）':''):raw?'入塾日: '+raw+'（日付要確認）':'入塾日: 未登録';
  label.textContent=text;
  const top=el('detail').querySelector('.admissionTop');
  if(String(selectedId)===id&&top)top.textContent=text;

function calcEnrollmentDuration(value) {
  const s = String(value || '').trim();
  const m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (!m) return '';
  const start = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  if (Number.isNaN(start.getTime())) return '';
  const today = new Date();
  let months = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
  if (today.getDate() < start.getDate()) months--;
  if (months < 0) return '';
  const years = Math.floor(months / 12);
  const rest = months % 12;
  if (years && rest) return `${years}年${rest}ヶ月`;
  if (years) return `${years}年`;
  return `${rest}ヶ月`;
}
