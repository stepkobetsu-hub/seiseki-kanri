<body>
<header><div class="brand"><span class="brandIcon" aria-hidden="true">🔎</span><div><h1>生徒情報検索</h1><div class="sub">個別指導STEP · 生徒マスタ</div></div></div><button id="logout" class="btn small secondary hidden" type="button">ログアウト</button></header>
<main>
 <section id="login" class="card login hidden"><h2>管理者ログイン</h2><p class="muted">成績管理と同じ管理者ID・パスワードを使用します。初回のログイン後は、ログアウトするまで保持します。</p><label>講師番号<input id="code" autocomplete="username" inputmode="numeric"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton" class="btn" type="button">ログイン</button><p id="loginError" class="error" role="alert"></p></section>
 <div id="app" class="hidden"><section class="card searchCard"><div class="searchTitle"><span class="searchTitleIcon" aria-hidden="true">🌱</span><div><h2>生徒を探す</h2><p>名前や生徒番号を入力すると、すぐに候補が表示されます。</p></div></div><div class="row searchRow"><div class="searchWrap"><span class="searchWrapIcon" aria-hidden="true">🔍</span><input id="search" class="search" type="search" autocomplete="off" placeholder="名前・ひらがな・ローマ字・生徒番号" aria-label="生徒検索"></div><button id="refresh" type="button" class="btn secondary">⟳ 最新情報を取得</button></div><p id="status" class="muted" role="status">読み込み中…</p><div id="candidates" class="candidates"></div></section><section id="detail" class="card hidden"></section></div>
</main>
<dialog id="zoom"><h2 id="zoomLabel"></h2><p id="zoomValue" style="font-size:1.6rem;overflow-wrap:anywhere;white-space:pre-wrap"></p><button class="btn" type="button" data-close="zoom">閉じる</button></dialog>
<dialog id="editor"><h2>☆マスタを編集</h2><p class="muted">数式の項目は変更できません。保存すると原本を書き換えます。</p><div id="editFields"></div><p id="editStatus" role="alert"></p><div class="actions"><button class="btn" id="save" type="button">変更を確認</button><button class="btn secondary" type="button" data-close="editor">キャンセル</button></div></dialog>

<script>
'use strict';
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const SHEET='https://docs.google.com/spreadsheets/d/1CIJkTlYUcUkbb8jBdFc6L8D5ubTGsxwNxFv01ten-Zk/edit#gid=829117795';
const MASTER_SHEET='https://docs.google.com/spreadsheets/d/1CIJkTlYUcUkbb8jBdFc6L8D5ubTGsxwNxFv01ten-Zk/edit#gid=674620482';
const TOKEN='adminSystemPortalSessionToken', EXPIRY='adminSystemPortalExpiresAt';
const INDEX_CACHE_KEY='stepStudentDirectorySearchIndexV1';
const LABELS={E:'生徒氏名',F:'フリガナ',H:'校舎',K:'学年',L:'生徒ログインPASS',M:'口座振替提出',N:'口座振替有効',P:'学校名',Q:'保護者氏名',R:'保護者フリガナ',S:'保護者続柄',T:'郵便番号',U:'住所（都道府県・市区町村）',V:'住所（番地）',W:'住所（建物名）',X:'保護者メール',Y:'保護者携帯',Z:'保護者自宅電話',AA:'第2保護者氏名',AB:'第2保護者フリガナ',AC:'第2保護者続柄',AE:'第2保護者携帯',AW:'成績パス'};
const el=id=>document.getElementById(id);
function statusBadge(flag){const value=String(flag??'').trim();if(value!=='0'&&value!=='')return null;const badge=document.createElement('span');badge.className='statusBadge '+(value===''?'withdrawn':'scheduled');badge.textContent=value===''?'退塾':'退塾予定';return badge}
let admissionIndexPromise=Promise.resolve();
let mode='personal',students=[],ready=false,selectedId='',editable=null,request=0,listRequest=0,listRefreshing=false,detailView=false;
function storage(){return localStorage}
function token(){return storage().getItem(TOKEN)||''}
function setStatus(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error)}
async function api(action,extra={},signal){const response=await fetch(GAS,{signal,method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...extra})});if(!response.ok)throw Error('通信に失敗しました。もう一度お試しください。');return response.json()}
function clearSession(){sessionStorage.removeItem('stepDirectoryGradeProfilesV1');resetDetails();request++;listRequest++;localStorage.removeItem(INDEX_CACHE_KEY);for(const store of [localStorage,sessionStorage])for(const key of [TOKEN,EXPIRY,'adminLoggedIn','adminStaffCode','adminStaffName','adminDeviceMode'])store.removeItem(key);mode='';students=[];ready=false;editable=null;selectedId='';detailView=false;document.querySelector('.searchCard').classList.remove('viewingDetail');el('detail').replaceChildren();el('detail').classList.add('hidden')}
function showLogin(message=''){el('app').classList.add('hidden');el('logout').classList.add('hidden');el('login').classList.remove('hidden');el('loginError').textContent=message;el('password').value='';}
function showApp(){el('login').classList.add('hidden');el('app').classList.remove('hidden');el('logout').classList.remove('hidden');loadList()}
async function logout(){const t=token();clearSession();showLogin();if(t)api('logoutSystemPortal',{systemPortalSessionToken:t}).catch(()=>{})}
async function start(){if(!token()){showLogin();return}showApp()}
async function login(){const code=el('code').value.trim(),password=el('password').value;if(!code||!password){el('loginError').textContent='講師番号とパスワードを入力してください。';return}el('loginButton').disabled=true;el('loginError').textContent='確認しています…';try{const r=await api('staffLogin',{code,password});if(!r.success||!r.systemPortalSessionToken)throw Error(r.error||'この画面には管理権限が必要です。');const store=storage();store.setItem('adminDeviceMode',mode);store.setItem('adminLoggedIn','1');store.setItem('adminStaffCode',r.code||code);store.setItem('adminStaffName',r.name||'');store.setItem(TOKEN,r.systemPortalSessionToken);store.setItem(EXPIRY,r.systemPortalExpiresAt||'');StepStaffAuth.persist(r.systemPortalSessionToken).then(()=>{if(token()===r.systemPortalSessionToken)store.setItem(EXPIRY,'2100-01-01T00:00:00.000Z')}).catch(()=>{});el('password').value='';showApp()}catch(e){el('loginError').textContent=e.message}finally{el('loginButton').disabled=false}}
function normalize(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s　]+/g,'')}
const PAIRS = {
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
  'しゃ':'sha','しゅ':'shu','しょ':'sho','じゃ':'ja','じゅ':'ju','じょ':'jo',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo',
  'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',

async function fetchDirectoryGradeProfile_(id){

  const requestTrace='directory-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  const cached=directoryGradeProfiles_.get(key);
  if(cached&&Date.now()-cached.time<60000)return cached.promise;
  const saved=readDirectoryGradeCache_(id,session);
  if(saved)return saved;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),45000);
  let deadline;
  const promise=Promise.race([
    (async()=>{
      const response=await StepStaffAuth.fetchRuntime({action:'getStudentGradeProfile',studentId:String(id),token:session,requestTrace},controller.signal);
      const data=await response.json();

      if(token()!==session)throw Error('ログイン状態が変更されました。');

    })(),
    new Promise((_,reject)=>{deadline=setTimeout(()=>reject(Error('成績情報の通信が時間内に完了しませんでした。')),46000);})
  ]).catch(error=>{error.requestTrace=requestTrace;if(directoryGradeProfiles_.get(key)?.promise===promise)directoryGradeProfiles_.delete(key);throw error;})

function normalizeDirectoryAdmission_(value){
  const raw=String(value||'').trim();if(!raw)return '';
  let year,month,day;
  const plain=raw.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})(?:日)?$/);
  if(plain){year=plain[1];month=plain[2].padStart(2,'0');day=plain[3].padStart(2,'0');}
  else {
    const date=new Date(raw);if(!Number.isFinite(date.getTime()))return '';
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
    const get=type=>parts.find(part=>part.type===type)?.value||'';
    year=get('year');month=get('month');day=get('day');
  }
  const result=year+'-'+month+'-'+day,check=new Date(result+'T00:00:00Z');
  return Number.isFinite(check.getTime())&&check.toISOString().slice(0,10)===result?result:'';
}

async function fetchDirectoryAdmission_(id,signal){

  };

  };

    const detail=await requestDetail(id);

  };

function calcEnrollmentDuration(value) {
  const s = String(value || '').trim();
  const m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (!m) return '';
  const start = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  if (Number.isNaN(start.getTime())) return '';
  const today = new Date();
  let months = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
  if (today.getDate() < start.getDate()) months--;
  if (months < 0) return '';
  const years = Math.floor(months / 12);
  const rest = months % 12;
  if (years && rest) return `${years}年${rest}ヶ月`;
  if (years) return `${years}年`;
  return `${rest}ヶ月`;
}

function openEditor(){if(!selectedId||!editable)return;const body=el('editFields');body.replaceChildren();for(const [letter,label] of Object.entries(LABELS)){const source=editable[letter];if(!source||source.formula)continue;const wrap=document.createElement('label');wrap.className='edit-field';wrap.textContent=`${label}（${letter}列）`;const input=document.createElement('input');input.dataset.letter=letter;if(['M','N'].includes(letter)){wrap.classList.add('checkboxEdit');input.type='checkbox';input.checked=checkboxChecked(source.value);wrap.append(input)}else{input.type=['L','AW'].includes(letter)?'password':'text';input.autocomplete='off';input.value=source.value??'';wrap.append(input)}body.append(wrap)}el('editStatus').textContent='';el('editor').showModal()}
async function save(){const changes={},lines=[];for(const input of el('editFields').querySelectorAll('input')){const letter=input.dataset.letter,before=String(editable[letter].value??''),isCheckbox=['M','N'].includes(letter),after=isCheckbox?(input.checked?'TRUE':'FALSE'):input.value;if(isCheckbox?checkboxChecked(before)===input.checked:before===after)continue;changes[letter]={before,after};lines.push(`${LABELS[letter]}：${isCheckbox?`${checkboxChecked(before)?'☑':'□'} → ${input.checked?'☑':'□'}`:['L','AW'].includes(letter)?'（変更前後の値は非表示）':`「${before||'空欄'}」→「${after||'空欄'}」`}`)}if(!lines.length){el('editStatus').textContent='変更はありません。';return}if(!confirm(`この変更を保存しますか？\n生徒番号：${selectedId}\n\n${lines.join('\n')}`))return;el('save').disabled=true;el('editStatus').textContent='原本に保存しています…';try{resetDetails();const id=selectedId,r=await mirrorApi('saveStudentDirectory',{studentId:id,changes,mutationId:crypto.randomUUID()});if(!r.success)throw Error(r.error||'保存できませんでした。');el('editor').close();await showSavedDetail(id,r);directorySyncedAt=0;setStatus('☆マスタへ保存し、最新の内容を読み直しました。')}catch(e){el('editStatus').textContent=e.message}finally{el('save').disabled=false}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());el('loginButton').onclick=login;el('password').onkeydown=e=>{if(e.key==='Enter')login()};el('refresh').onclick=loadList;el('search').oninput=()=>{if(detailView){request++;selectedId='';editable=null;detailView=false;document.querySelector('.searchCard').classList.remove('viewingDetail');el('detail').replaceChildren();el('detail').classList.add('hidden')}renderCandidates()};el('save').onclick=save;el('logout').onclick=()=>logout();start();
</script>
</body>
