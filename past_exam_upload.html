<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>過去問アップロード</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/past-exam/favicon.png">
<link rel="apple-touch-icon" href="images/past-exam/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f8;color:#172033;font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 42px}
.hero{background:#145da0;color:#fff;border-radius:16px;padding:20px;box-shadow:0 14px 30px rgba(20,93,160,.18)}
h1{margin:0;font-size:1.45rem;letter-spacing:0}.hero p{margin:8px 0 0;color:#eaf4ff;line-height:1.7}
.card{background:#fff;border:1px solid #dbe7f2;border-radius:14px;margin-top:14px;padding:16px;box-shadow:0 10px 24px rgba(15,35,60,.07)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:.82rem;font-weight:800;color:#475569;margin-bottom:5px}
input,select{width:100%;border:1px solid #c9d6e5;border-radius:10px;padding:12px;font-size:1rem;background:#fff}
input.invalid,select.invalid{border-color:#dc2626;background:#fff5f5;box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.fieldErr{display:none;margin-top:5px;color:#dc2626;font-size:.78rem;font-weight:800}
.fieldErr.show{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:900;cursor:pointer;font-size:1rem}
.primary{background:#145da0;color:#fff}.ghost{background:#edf5fc;color:#145da0}.submit{width:100%;font-size:1.08rem;padding:15px;margin-top:16px}
.msg{margin-top:12px;white-space:pre-wrap;font-weight:800;line-height:1.7}.ok{color:#047857}.err{color:#dc2626}
.small{font-size:.86rem;color:#64748b;line-height:1.7}.result{border-top:1px solid #e2eaf3;margin-top:14px;padding-top:12px}
.result a{color:#145da0;font-weight:900;word-break:break-all}.hidden{display:none!important}
.cameraOverlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:none;align-items:center;justify-content:center;padding:12px}
.cameraOverlay.open{display:flex}
.cameraBox{width:min(720px,100%);background:#111827;border-radius:16px;padding:12px;color:#fff}
.cameraBox video{width:100%;max-height:68vh;background:#000;border-radius:12px;object-fit:contain}
.cameraActions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.cameraActions .btn{flex:1;min-width:130px}
@media(max-width:640px){main{padding:14px 10px 34px}.hero{border-radius:0;margin:-14px -10px 0}.grid{grid-template-columns:1fr}.btn{width:100%}.card{border-radius:12px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>過去問アップロード</h1>
    <p>スマホで使いやすい職員用アップロード画面です。学校ごとのテスト回数に合わせて登録します。</p>
  </section>

  <section class="card">
    <div class="grid">
      <div><label>アップロードする人の苗字</label><input id="teacher" placeholder="例: 加瀬"><div class="fieldErr" data-for="teacher">入力してください</div></div>
      <div><label>学校名</label><select id="school"><option value="">読み込み中...</option></select><div class="fieldErr" data-for="school">選択してください</div></div>
      <div><label>学年</label><select id="grade"><option value="">選択</option><option>中1</option><option>中2</option><option>中3</option></select><div class="fieldErr" data-for="grade">選択してください</div></div>
      <div><label>科目</label><select id="subject"><option value="">選択</option><option>英語</option><option>数学</option><option>国語</option><option>理科</option><option>社会</option></select><div class="fieldErr" data-for="subject">選択してください</div></div>
      <div><label>年度</label><select id="year"><option value="">選択</option></select><div class="fieldErr" data-for="year">選択してください</div></div>
      <div><label>回</label><select id="testNo"><option value="">学校を選択してください</option></select><div class="fieldErr" data-for="testNo">選択してください</div></div>
      <div><label>種類</label><select id="kind"><option value="">選択</option><option>テストのみ</option><option>テスト＆先生解答</option><option>テスト＆生徒解答</option><option>先生解答のみ</option><option>生徒解答のみ</option></select><div class="fieldErr" data-for="kind">選択してください</div></div>
    </div>

    <div style="margin-top:12px">
      <label>ファイル</label>
      <div style="display:flex;gap:10px;align-items:stretch;flex-wrap:wrap">
        <input id="file" type="file" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx" multiple style="flex:1;min-width:260px">
        <button id="cameraBtn" type="button" class="btn ghost" style="white-space:nowrap" onclick="openCamera()">📷 カメラで取り込み</button>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden">
      </div>
      <div id="cameraStatus" class="small" style="margin-top:7px;font-weight:800;color:#145da0"></div>
      <div class="fieldErr" data-for="file">ファイルを選択するか、カメラで撮影してください</div>
      <p class="small">PDF、写真、Word、Excelをアップロードできます。写真（JPEG/PNG）は自動でPDF化します。複数の写真は1つのPDFにまとめます。カメラは繰り返し撮影できます。</p>
    </div>

    <button id="submitBtn" class="btn primary submit" onclick="uploadFiles()">アップロードする</button>
    <div class="btns">
      <a class="btn ghost" style="text-decoration:none;text-align:center" href="index.html">職員用トップへ戻る</a>
      <a class="btn ghost" style="text-decoration:none;text-align:center" href="past_exam_db.html">過去問DBを開く</a>
    </div>
    <div id="msg" class="msg"></div>
    <div id="results" class="result hidden"></div>
  </section>
</main>
<div id="cameraOverlay" class="cameraOverlay">
  <div class="cameraBox">
    <div style="font-weight:900;margin:2px 0 10px">カメラで取り込み</div>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="cameraCanvas" class="hidden"></canvas>
    <div class="cameraActions">
      <button type="button" class="btn primary" onclick="takeCameraPhoto()">📷 撮影する</button>
      <button type="button" class="btn ghost" onclick="closeCamera()">閉じる</button>
    </div>
    <div id="cameraHelp" class="small" style="color:#cbd5e1;margin-top:8px"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxqxQOmtwe9lfB0Pt7dKzY3mC2sSRRVG9haDTMvOvrzyQNxhOYQLMTbnxAm9Im3LlXj/exec';
const PASS='step123';
const DEFAULT_SCHOOLS = [
  {id:'s1',name:'南城中学',examCount:5},
  {id:'s2',name:'高蔵寺中学',examCount:5},
  {id:'s3',name:'志段味中学',examCount:5},
  {id:'s4',name:'坂下中学',examCount:5},
  {id:'s5',name:'鷹来中学',examCount:5},
  {id:'s6',name:'西部中学',examCount:5},
  {id:'s7',name:'東部中学',examCount:5},
];
const $=id=>document.getElementById(id);
let schools=[];
let db={};
let dbReady=false;
let cameraFiles=[];
let cameraStream=null;
function value(id){return ($(id)?.value||'').trim()}
function setMsg(text,ok){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=text}
function cleanName(s){return String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'').trim()}
function extOf(name){const m=String(name||'').match(/(\.[^.]+)$/);return m?m[1]:''}
function baseName(name){return String(name||'file').replace(/\.[^.]+$/,'')}
function buildFileName(file, forceExt, forceBase){
  const school=schools.find(s=>String(s.id)===value('school'));
  const parts=[value('teacher'),school?.name||'',value('grade'),value('subject'),value('year'),value('testNo'),value('kind')].map(cleanName).filter(Boolean);
  const original=cleanName(forceBase || baseName(file.name))||'file';
  const prefix=parts.length?parts.join('_')+'_':'';
  return prefix+original+(forceExt || extOf(file.name));
}
function isImageFile(file){
  return !!file && (String(file.type||'').startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||''));
}
async function openCamera(){
  closeCamera();
  $('cameraHelp').textContent='カメラを準備しています...';
  $('cameraOverlay').classList.add('open');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('cameraHelp').innerHTML='このブラウザではページ内カメラを使えません。<br><button type="button" class="btn ghost" style="margin-top:8px" onclick="openNativeCamera()">📷 端末のカメラを開く</button>';
    return;
  }

  let lastErr=null;
  const tries=[
    {video:{facingMode:{exact:'environment'}},audio:false},
    {video:{facingMode:{ideal:'environment'}},audio:false},
    {video:true,audio:false}
  ];
  for(const constraints of tries){
    try{
      cameraStream=await navigator.mediaDevices.getUserMedia(constraints);
      $('cameraVideo').srcObject=cameraStream;
      try{await $('cameraVideo').play()}catch(e){}
      $('cameraHelp').textContent='撮影後も続けて何枚でも取り込めます。';
      return;
    }catch(e){ lastErr=e; }
  }

  const name=(lastErr&&lastErr.name)||'';
  let reason='この端末ではページ内カメラを開始できませんでした。';
  if(name==='NotAllowedError' || name==='PermissionDeniedError'){
    reason='カメラの使用が許可されていません。Chromeのサイト設定で「カメラ」を許可してから再試行してください。';
  }else if(name==='NotFoundError' || name==='DevicesNotFoundError'){
    reason='利用できるカメラが見つかりませんでした。';
  }else if(name==='NotReadableError' || name==='TrackStartError'){
    reason='ほかのアプリがカメラを使用中の可能性があります。カメラアプリ等を閉じて再試行してください。';
  }
  $('cameraHelp').innerHTML=reason+
    '<div class="cameraActions" style="margin-top:10px">'+
    '<button type="button" class="btn primary" onclick="openCamera()">もう一度試す</button>'+
    '<button type="button" class="btn ghost" onclick="openNativeCamera()">📷 端末のカメラを開く</button>'+
    '</div>';
}
function openNativeCamera(){
  closeCamera();
  $('cameraInput').click();
}
function closeCamera(){
  $('cameraOverlay').classList.remove('open');
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=null;
  }
  $('cameraVideo').srcObject=null;
}
async function takeCameraPhoto(){
  const video=$('cameraVideo');
  if(!video.videoWidth || !video.videoHeight){
    setMsg('カメラ映像の準備中です。少し待ってからもう一度押してください。',false);
    return;
  }
  const canvas=$('cameraCanvas');
  const maxPx=2200;
  const scale=Math.min(1,maxPx/Math.max(video.videoWidth,video.videoHeight));
  canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
  canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));
  if(!blob){
    setMsg('撮影画像を作成できませんでした。',false);
    return;
  }
  const name='camera_'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';
  cameraFiles.push(new File([blob],name,{type:'image/jpeg',lastModified:Date.now()}));
  updateCameraStatus();
  clearInvalid('file');
  $('cameraHelp').textContent='撮影しました。続けて撮るか、「閉じる」を押してください。';
}
function updateCameraStatus(){
  $('cameraStatus').textContent = cameraFiles.length ? `📷 撮影済み：${cameraFiles.length}枚（続けて撮影できます）` : '';
}
function clearSelectedFiles(){
  $('file').value='';
  $('cameraInput').value='';
  cameraFiles=[];
  updateCameraStatus();
}
function currentNendo(){
  const now=new Date();
  return now.getMonth()<3?now.getFullYear()-1:now.getFullYear();
}
function updateYearOptions(){
  const year=currentNendo();
  const years=[year,year-1,year-2];
  $('year').innerHTML='<option value="">選択</option>'+years.map(y=>`<option value="${y}">${y}年度</option>`).join('');
  $('year').value=String(year);
}
function dbKey(sid,year,grade,exam,subject){return `${sid}||${year}||${grade}||${exam}||${subject}`}
function selectedSchool(){return schools.find(s=>String(s.id)===value('school'))}
function examList(count){return Array.from({length:Number(count)||0},(_,i)=>`第${i+1}回`)}
function updateExamOptions(){
  const school=selectedSchool();
  if(!school){
    $('testNo').innerHTML='<option value="">学校を選択してください</option>';
    return;
  }
  const exams=examList(school.examCount);
  $('testNo').innerHTML='<option value="">選択</option>'+exams.map(ex=>`<option>${ex}</option>`).join('');
}
async function gasGet(params, attempt=1){
  const query={...params,_ts:Date.now(),_try:attempt};
  const url=GAS_URL+'?'+Object.entries(query).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(url,{cache:'no-store',redirect:'follow',signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    try{return JSON.parse(text)}
    catch(e){throw new Error('応答形式エラー')}
  }finally{
    clearTimeout(timer);
  }
}
function renderSchoolOptions(list){
  schools=Array.isArray(list)&&list.length?list:JSON.parse(JSON.stringify(DEFAULT_SCHOOLS));
  $('school').innerHTML='<option value="">選択</option>'+schools.map(s=>`<option value="${String(s.id).replace(/"/g,'&quot;')}">${s.name}（年${s.examCount}回）</option>`).join('');
  updateExamOptions();
}
function loadCachedSchools(){
  try{
    const cached=JSON.parse(localStorage.getItem('pastExamSchools')||'null');
    if(Array.isArray(cached)&&cached.length) return cached;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_SCHOOLS));
}
async function loadDb(){
  updateYearOptions();
  dbReady=false;
  $('submitBtn').disabled=false;
  renderSchoolOptions(loadCachedSchools());
  setMsg('学校一覧を表示しました。最新情報を確認中です...',true);

  let lastErr=null;
  for(let attempt=1;attempt<=5;attempt++){
    try{
      const r=await gasGet({action:'load',pass:PASS},attempt);
      if(!r.ok) throw new Error(r.error||'読み込みに失敗しました');
      const remoteSchools=(r.data&&r.data.schools)||[];
      db=(r.data&&r.data.db)||{};
      renderSchoolOptions(remoteSchools);
      try{localStorage.setItem('pastExamSchools',JSON.stringify(schools))}catch(e){}
      dbReady=true;
      $('submitBtn').disabled=false;
      setMsg('学校一覧を読み込みました。',true);
      return;
    }catch(e){
      lastErr=e;
      if(attempt<5){
        if(attempt===1) setMsg('学校一覧を表示中です。最新情報を再確認しています...',true);
        await new Promise(r=>setTimeout(r,700*attempt));
      }
    }
  }

  renderSchoolOptions(loadCachedSchools());
  $('submitBtn').disabled=false;
  setMsg('学校一覧は前回の情報を表示しています。アップロード時に最新DBへ再接続します。',true);
}
function clearInvalid(id){
  const el=$(id);
  if(el) el.classList.remove('invalid');
  const err=document.querySelector(`.fieldErr[data-for="${id}"]`);
  if(err) err.classList.remove('show');
}
function markInvalid(id,message){
  const el=$(id);
  if(el) el.classList.add('invalid');
  const err=document.querySelector(`.fieldErr[data-for="${id}"]`);
  if(err){
    if(message) err.textContent=message;
    err.classList.add('show');
  }
}
function validateRequired(){
  const required=['teacher','school','grade','subject','year','testNo','kind'];
  let ok=true;
  required.forEach(id=>{
    clearInvalid(id);
    if(!value(id)){markInvalid(id); ok=false;}
  });
  clearInvalid('file');
  if(!($('file').files||[]).length && !cameraFiles.length){markInvalid('file'); ok=false;}
  if(!ok) setMsg('赤枠の項目を入力してください。',false);
  return ok;
}
function toBase64Url(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=> {
      const data=String(reader.result||'');
      const b64=data.split(',')[1]||'';
      resolve(b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''));
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||''));
    reader.onerror=()=>reject(new Error('画像を読み込めませんでした'));
    reader.readAsDataURL(file);
  });
}
function loadImage(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('画像をPDFへ変換できませんでした'));
    img.src=dataUrl;
  });
}
async function imagesToPdfFile(imageFiles){
  if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('PDF変換機能を読み込めませんでした。通信状態を確認して再読み込みしてください。');
  const {jsPDF}=window.jspdf;
  let pdf=null;
  for(let i=0;i<imageFiles.length;i++){
    setMsg(`写真をPDFに変換中です... ${i+1}/${imageFiles.length}`,true);
    const dataUrl=await readAsDataURL(imageFiles[i]);
    const img=await loadImage(dataUrl);
    const landscape=img.naturalWidth>img.naturalHeight;
    const orientation=landscape?'landscape':'portrait';
    if(!pdf) pdf=new jsPDF({orientation,unit:'mm',format:'a4',compress:true});
    else pdf.addPage('a4',orientation);
    const pageW=landscape?297:210;
    const pageH=landscape?210:297;
    const margin=8;
    const maxW=pageW-margin*2;
    const maxH=pageH-margin*2;
    const ratio=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight);
    const w=img.naturalWidth*ratio;
    const h=img.naturalHeight*ratio;
    const x=(pageW-w)/2;
    const y=(pageH-h)/2;
    let format='JPEG';
    let outData=dataUrl;
    if(!/^data:image\/jpe?g/i.test(dataUrl)){
      const canvas=document.createElement('canvas');
      const maxPx=2200;
      const scale=Math.min(1,maxPx/Math.max(img.naturalWidth,img.naturalHeight));
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      outData=canvas.toDataURL('image/jpeg',0.88);
    }
    pdf.addImage(outData,format,x,y,w,h,undefined,'FAST');
  }
  const blob=pdf.output('blob');
  return new File([blob],'写真まとめ.pdf',{type:'application/pdf',lastModified:Date.now()});
}
async function prepareUploadFiles(){
  const picked=[...($('file').files||[])];
  const all=[...picked,...cameraFiles];
  const images=all.filter(isImageFile);
  const others=all.filter(f=>!isImageFile(f));
  const prepared=[...others];
  if(images.length){
    const pdfFile=await imagesToPdfFile(images);
    pdfFile._stepPdfFromImages=true;
    prepared.unshift(pdfFile);
  }
  return prepared;
}
async function uploadOne(file){
  const storedName=buildFileName(file, file._stepPdfFromImages?'.pdf':undefined, file._stepPdfFromImages?'写真まとめ':undefined);
  const body=new URLSearchParams();
  body.set('action','uploadAll');
  body.set('pass',PASS);
  body.set('fileName',storedName);
  body.set('mimeType',file.type||'application/octet-stream');
  body.set('fileData',await toBase64Url(file));
  const res=await fetch(GAS_URL,{method:'POST',body});
  const text=await res.text();
  try{
    const json=JSON.parse(text);
    if(json.ok) json.storedName=storedName;
    return json;
  }catch(e){throw new Error('GASからJSON以外の応答が返りました: '+text.slice(0,120))}
}
async function saveDb(){
  const body=new URLSearchParams();
  body.set('action','saveFull');
  body.set('pass',PASS);
  body.set('payload',JSON.stringify({schools,db}));
  const res=await fetch(GAS_URL,{method:'POST',body});
  const json=await res.json();
  if(!json.ok) throw new Error(json.error||'DB登録に失敗しました');
  return json;
}
function registerFile(file,result){
  const school=selectedSchool();
  const year=value('year');
  const grade=value('grade');
  const subject=value('subject');
  const exam=value('testNo');
  if(!school||!year||!grade||!subject||!exam) throw new Error('学校・年度・学年・科目・回を選択してください');
  const key=dbKey(school.id,year,grade,exam,subject);
  if(!db[key]) db[key]={files:[],noan:false,stu:false};
  if(!db[key].files) db[key].files=[];
  const today=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
  if(!db[key].files.some(x=>x.fileId===result.fileId)){
    db[key].files.push({
      name: result.storedName||file.name,
      url: result.url,
      fileId: result.fileId,
      date: today,
      kind: value('kind'),
      isNew: true
    });
  }
  db[key].hasNew=true;
}
async function ensureDbReady(){
  if(dbReady) return true;
  setMsg('最新DBへ接続しています...',true);
  let lastErr=null;
  for(let attempt=1;attempt<=5;attempt++){
    try{
      const r=await gasGet({action:'load',pass:PASS},attempt+10);
      if(!r.ok) throw new Error(r.error||'読み込みに失敗しました');
      const remoteSchools=(r.data&&r.data.schools)||[];
      db=(r.data&&r.data.db)||{};
      renderSchoolOptions(remoteSchools);
      try{localStorage.setItem('pastExamSchools',JSON.stringify(schools))}catch(e){}
      dbReady=true;
      return true;
    }catch(e){
      lastErr=e;
      if(attempt<5) await new Promise(r=>setTimeout(r,1000*attempt));
    }
  }
  setMsg('最新DBへ接続できませんでした。誤った上書きを防ぐため今回はアップロードを停止しました。通信状態を確認して、もう一度「アップロードする」を押してください。'+((lastErr&&lastErr.message)?'\n'+lastErr.message:''),false);
  return false;
}
async function uploadFiles(){
  if(!validateRequired()) return;
  if(!(await ensureDbReady())) return;
  localStorage.setItem('pastExamTeacher', value('teacher'));
  $('submitBtn').disabled=true;
  $('results').classList.add('hidden');
  $('results').innerHTML='';
  try{
    const files=await prepareUploadFiles();
    const saved=[];
    for(let i=0;i<files.length;i++){
      setMsg(`アップロード中です... ${i+1}/${files.length}`,true);
      const r=await uploadOne(files[i]);
      if(!r.ok) throw new Error(r.error||'アップロードに失敗しました');
      registerFile(files[i],r);
      saved.push({name:r.storedName||buildFileName(files[i]),url:r.url});
    }
    setMsg('DBへ登録中です...',true);
    await saveDb();
    setMsg('アップロードして過去問DBへ登録しました。',true);
    $('results').innerHTML='<strong>保存したファイル</strong><br>'+saved.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.name}</a>`).join('<br>');
    $('results').classList.remove('hidden');
    clearSelectedFiles();
  }catch(e){
    setMsg(e.message||'アップロードに失敗しました。',false);
  }finally{
    $('submitBtn').disabled=false;
  }
}
$('cameraInput').addEventListener('change',()=>{
  const f=$('cameraInput').files&&$('cameraInput').files[0];
  if(f){
    cameraFiles.push(f);
    updateCameraStatus();
    clearInvalid('file');
  }
  // 同じ端末で続けて撮影できるように毎回リセット
  $('cameraInput').value='';
});
$('school').addEventListener('change',updateExamOptions);
['teacher','school','grade','subject','year','testNo','kind','file'].forEach(id=>{
  $(id).addEventListener('input',()=>clearInvalid(id));
  $(id).addEventListener('change',()=>clearInvalid(id));
});
window.addEventListener('pagehide',closeCamera);
window.addEventListener('load',()=>{
  const savedTeacher=localStorage.getItem('pastExamTeacher');
  if(savedTeacher) $('teacher').value=savedTeacher;
  loadDb();
});
</script>
