<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="料金特別調整">
<title>料金特別調整</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/billing-adjustment-icon-180.png?v=20260903-favicon-restored">
<link rel="icon" type="image/png" sizes="512x512" href="icons/billing-adjustment-icon-512.png?v=20260903-favicon-restored">\n<link rel="shortcut icon" type="image/png" href="icons/billing-adjustment-icon-180.png?v=20260903-favicon-restored">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#f3f5f8;font-family:Meiryo,"Noto Sans JP",sans-serif;overflow:hidden}
.shell{display:flex;flex-direction:column;width:100%;height:100%;padding-top:env(safe-area-inset-top);background:#f3f5f8}
.header{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#0b3f91;color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.header img{width:36px;height:36px;border-radius:9px}
.header strong{font-size:17px;letter-spacing:.02em}.logoutBtn{margin-left:auto;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.logoutBtn:active{background:rgba(255,255,255,.25)}
.frameWrap{position:relative;flex:1;min-height:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#334155;font-weight:800;background:#f3f5f8}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f3f5f8}
@media(min-width:800px){.header{height:54px;padding-left:18px}.header img{width:40px;height:40px}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <img src="icons/billing-adjustment-icon-180.png?v=20260903-favicon-restored" alt="">
    <strong>料金特別調整</strong>
    <button class="logoutBtn" type="button" onclick="logoutBilling()">ログアウト</button>
  </header>
  <div class="frameWrap">
    <div class="loading">料金特別調整を開いています…</div>
    <iframe
      id="billingFrame"
      title="料金特別調整"
      src="https://script.google.com/macros/s/AKfycbxzkE1tQRyB_Ca4bfPKYWIkpTukIVPMWKf2ETE7yN7qROJk0VyOlvxaJ9GGI5p-6pGb/exec?page=adjustments"
      allow="clipboard-read; clipboard-write"
      onload="document.querySelector('.loading').style.display='none'"></iframe>
  </div>
</div>
<script>
function logoutBilling(){
  if(!confirm('ログアウトしますか？')) return;
  document.getElementById('billingFrame').src =
    'https://script.google.com/macros/s/AKfycbxzkE1tQRyB_Ca4bfPKYWIkpTukIVPMWKf2ETE7yN7qROJk0VyOlvxaJ9GGI5p-6pGb/exec?page=adjustments&logout=1';
}
</script>
</body>
</html>
