<!doctype html>
<html lang="ja">
<head>

  <link rel="apple-touch-icon" href="images/system-portal/apple-touch-icon.png?v=20260720-hex">
  <style>
    :root{color-scheme:light;--navy:#102a43;--blue:#2563eb;--line:#d8e2ec;--bg:#f4f7fb;--muted:#627d98;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#152536}
    button,input,select{font:inherit}.hidden{display:none!important}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:58px;height:58px;border-radius:14px;object-fit:cover;box-shadow:0 5px 15px rgba(16,42,67,.16)}h1{font-size:clamp(24px,4vw,36px);margin:0;color:var(--navy)}
    .lead{margin:7px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.open,.copy{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;text-decoration:none}
    .btn{background:#e6edf5;color:var(--navy)}.open{background:var(--blue);color:#fff}.copy{background:#edf4ff;color:#1d4ed8}.copy:focus-visible,.open:focus-visible,.btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .notice{padding:14px 16px;border:1px solid #f3c8c4;background:#fff3f2;border-radius:12px;color:var(--danger);font-weight:700}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 220px 220px auto;gap:10px;margin:18px 0}
    .toolbar input,.toolbar select{width:100%;border:1px solid #bcccdc;border-radius:10px;padding:11px 12px;background:#fff}.count{color:var(--muted);font-weight:700;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(16,42,67,.06);min-width:0}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card h2{font-size:20px;margin:0;color:var(--navy)}.status{white-space:nowrap;padding:4px 9px;border-radius:999px;background:#e7f8ef;color:#147d4d;font-weight:800;font-size:12px}
    .meta{color:var(--muted);font-size:13px;margin:5px 0}.summary{line-height:1.65}.group{border-top:1px solid #edf2f7;margin-top:14px;padding-top:12px}.group h3{font-size:14px;margin:0 0 9px;color:#486581}
    .link-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;margin:7px 0}.link-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.unknown{font-size:13px;color:#7c5d00;background:#fff8d9;border-radius:8px;padding:8px 10px;margin:6px 0}
    .details{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.6;color:#486581}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#102a43;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5}
    @media(max-width:780px){header{display:block}.top-actions{margin-top:12px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}.link-row{grid-template-columns:1fr auto}.link-row .copy{grid-column:2}.shell{width:min(100% - 20px,1180px)}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><img class="brand-icon" src="images/system-portal/app-icon-192.png?v=20260720" alt="STEP総合管理ポータル"><div><h1>STEP総合管理ポータル</h1><p class="lead">権限2・3・4で利用できます。利用・管理・共有用の入口をまとめて確認できます。</p></div></div>
      <div class="top-actions"><a class="btn" href="index.html">スタッフ用アプリへ戻る</a><button class="btn" id="logoutBtn" type="button">ログアウト</button></div>
    </header>
    <section id="denied" class="notice hidden" role="alert"></section>
    <section id="portal" class="hidden">
      <div class="toolbar">
        <input id="search" type="search" placeholder="システム名・概要・担当・注意事項を検索">
        <select id="category"><option value="">すべての分類</option></select>
        <select id="status"><option value="">すべての状態</option></select>
        <button class="btn" id="clearBtn" type="button">クリア</button>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="cards"></div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite">URLをコピーしました</div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const AUTH_KEY='stepStaffAppAuth';
const GROUPS=[
  {title:'利用する',fields:[['利用者向けURL','利用者向けアプリを開く'],['読み取りURL','読み取りアプリを開く'],['印刷URL','印刷ページを開く'],['Apps Script WebアプリURL','Webアプリを開く'],['GitHub Pages URL','公開ページを開く']]},
  {title:'管理する',fields:[['管理者向けURL','管理者向けアプリを開く'],['Google Sheet URL','Google Sheetを開く'],['Supabase URL','Supabase管理画面を開く'],['入力フォームURL','登録画面を開く']]},
  {title:'修正する',fields:[['GitHub URL','GitHubを開く'],['Apps Script編集URL','Apps Scriptを編集']]},
  {title:'メモ・保管場所',fields:[['DriveファイルURL','Driveファイルを開く'],['DriveフォルダURL','Driveフォルダを開く'],['仕様書URL','仕様書を開く'],['バックアップURL','バックアップを開く'],['GitHubドキュメントURL','GitHubドキュメントを開く'],['その他保管場所URL','その他の保管場所を開く']]},
  {title:'関連・旧版',fields:[['旧版URL','旧版を開く']]}
];
const ASSET_SECTIONS=[
  {title:'保存先',fields:[['保存基盤','保存基盤'],['保存先Spreadsheet ID','Spreadsheet ID'],['Google Sheet名','Google Sheet名'],['管理対象','管理対象'],['使用シート名','使用シート'],['電話番号列','電話番号列'],['電話番号形式','電話番号形式'],['データベース名','データベース名']]},
  {title:'Apps Script',fields:[['Apps Script種別','Apps Script種別'],['Apps Script概要','主な処理'],['Webアプリ設定','Webアプリ設定'],['トリガー','トリガー'],['Apps Script確認','編集URLの登録状況']]},
  {title:'関連システム',fields:[['参照システム','参照しているシステム'],['被参照システム','参照されているシステム'],['共有マスタ','共有マスタ'],['影響先','変更時の影響先']]},
  {title:'連携メモ',fields:[['連携メモ','連携メモ'],['連絡先運用','連絡先運用']]},
  {title:'正本・最新版',fields:[['正本ファイル','正本ファイル'],['API処理ファイル','API処理ファイル'],['最新版の場所','最新版の場所'],['確認日','確認日'],['確認根拠','確認根拠']]},
  {title:'メモ・保管場所',fields:[['作業メモ','作業メモ'],['仕様メモ','仕様メモ'],['バックアップ場所','バックアップ場所'],['Google Drive','Google Drive'],['GitHubドキュメント','GitHubドキュメント'],['その他保管場所','その他保管場所'],['新たな保管場所','新たな保管場所']]},
  {title:'確認済み',fields:[['確認済み事項','確認済み']]},
  {title:'未確認',fields:[['未確認項目','未確認']]}
];
let systems=[];
document.addEventListener('DOMContentLoaded',init);
document.getElementById('search').addEventListener('input',render);
document.getElementById('category').addEventListener('change',render);
document.getElementById('status').addEventListener('change',render);
document.getElementById('clearBtn').addEventListener('click',()=>{document.getElementById('search').value='';document.getElementById('category').value='';document.getElementById('status').value='';render()});
document.getElementById('logoutBtn').addEventListener('click',logout);

function auth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}
async function api(action,extra){const a=auth();const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,systemPortalSessionToken:a?.systemPortalSessionToken||''},extra||{})),redirect:'follow'});return res.json()}
async function init(){const a=auth();if(!a||!['2','3','4'].includes(String(a.permissionLevel))||!a.systemPortalSessionToken)return deny('権限2・3・4で再ログインしてください。');try{const out=await api('getSystemRegistry');if(!out.success)throw new Error(out.error||'台帳を取得できませんでした。');systems=organizeEntryImport(Array.isArray(out.systems)?out.systems:[]);fillFilters();document.getElementById('portal').classList.remove('hidden');render()}catch(e){deny(e.message||'権限を確認できませんでした。再ログインしてください。')}}
function deny(message){document.getElementById('portal').classList.add('hidden');const el=document.getElementById('denied');el.textContent=message;el.classList.remove('hidden')}
async function logout(){try{await api('logoutSystemPortal')}catch(e){}localStorage.removeItem(AUTH_KEY);location.href='index.html'}
function fillFilters(){fill('category',unique(systems.map(x=>x['分類'])));fill('status',unique(systems.map(x=>x['状態'])))}
function fill(id,values){const s=document.getElementById(id);values.forEach(v=>{if(!v)return;const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
function unique(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ja'))}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const c=document.getElementById('category').value;const st=document.getElementById('status').value;const list=systems.filter(x=>(!c||x['分類']===c)&&(!st||x['状態']===st)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));const root=document.getElementById('cards');root.replaceChildren(...list.map(card));document.getElementById('count').textContent=`${list.length}件 / 全${systems.length}件`}
function isQrRegister(item){return item['ID']==='qr-register'||item['システム名']==='出退くんQR作成・読取'}
function isJukuCard(item){return item['ID']==='juku-card'||item['システム名']==='受付カード読み取り'}
function organizeEntryImport(items){const list=items.map(item=>Object.assign({},item));const grade=list.find(isGradeSystem);const juku=list.find(isJukuCard);if(!grade||!juku)return list;const entryUrl=(grade['読み取りURL']||'').trim();if(entryUrl)juku['読み取りURL']=entryUrl;delete grade['読み取りURL'];grade['システム名']='成績管理';grade['概要']='テスト成績・通知表・志望校・面談メモを管理';juku['システム名']='受付カード・エントリーシート読み取り';juku['概要']='受付カードの登録・一覧管理・印刷・エントリーシート読み取り';return list}
function applyConfirmedInfo(item){const name=String(item['システム名']||'');const target=['出退くん','受付カード','不達メール','成績管理','面談メモ','過去問','STEPメッセージ','STEP配信','講師スケジュール','講師予定','夏休み出勤','請求管理'].some(key=>name.includes(key));const contact=name.includes('お問い合わせ管理');const student=name.includes('生徒マスタ');const absence=name.includes('欠席・遅刻連絡');if(!target&&!contact&&!student&&!absence)return item;const patch=target||contact?{'確認状況':'確認済'}:{'確認状況':'Google Sheet確認済／バインドApps Script実コード未確認'};if(name.includes('受付カード'))Object.assign(patch,{'Google Sheet名':'受付カード一覧','使用シート名':'受付カード一覧'});if(name.includes('不達メール'))Object.assign(patch,{'Google Sheet名':'入退室ログ２','使用シート名':'不達メール管理'});if(contact)Object.assign(patch,{'Google Sheet名':'お問い合わせ管理','使用シート名':'お問い合わせ','保存先Spreadsheet ID':'18VKKfPZ_AE-j-mz995Aru0KLLsWsFdoizBXH9PTYyaA','Apps Script概要':'問い合わせ受信・自動返信・管理者通知・週次確認・Google連絡先登録更新','Apps Script確認':(item['Apps Script編集URL']||'').trim()?'Apps Scriptコード・編集URL確認済み':'Apps Scriptコード確認済み・編集URL未登録','連絡先運用':'People API使用／電話番号重複時は最下行を最新版として採用／生徒管理側を優先'});if(absence)Object.assign(patch,{'Google Sheet名':'欠席・遅刻連絡','使用シート名':'★欠席遅刻','保存先Spreadsheet ID':'1c2He5p_FMXGq0Gor74wIrJKtdBvTdjmO992ZkNSVuLQ','保存処理':'Apps Script','通知':'管理者メール・LINE','Apps Script概要':'フォーム受付、Sheet保存、管理者メール通知、LINE受付通知、日付別の行色分け','Apps Script確認':(item['Apps Script編集URL']||'').trim()?'Apps Scriptコード・編集URL確認済み':'Apps Scriptコード確認済み・編集URL未登録','確認状況':'確認済み'});if(student){Object.assign(patch,{'Google Sheet名':'生徒マスタ','使用シート名':'☆マスタ','Apps Script確認':'バインドApps Script実コード未確認'});const relation='Google連絡先では生徒管理側を優先';patch['関連システム']=String(item['関連システム']||'').includes(relation)?item['関連システム']:[item['関連システム'],relation].filter(Boolean).join('／')}return Object.assign({},item,patch)}
function applyAssetInfo(item){const name=String(item['システム名']||'');const patch={};if(name.includes('生徒マスタ'))Object.assign(patch,{'Google Sheet名':'生徒マスタ','使用シート名':'☆マスタ','関連カード':['お問い合わせ管理','成績管理','面談メモ','受付カード読み取り','出退くんQR作成・読取'],'連携メモ':['Google連絡先では生徒管理側を優先','お問い合わせ管理側より生徒管理側の情報を優先する設計'],'確認済み事項':['Google Sheetリンク','Google Sheet名：生徒マスタ','使用シート：☆マスタ','Google連絡先の優先設計'],'未確認項目':['バインドApps Script実コード','Apps Script編集URL','関数一覧','トリガー一覧','Webアプリ公開の有無'],'確認状況':'Google Sheet確認済み / Apps Script実コード未確認'});if(name.includes('出退くん'))Object.assign(patch,{'保存基盤':'Google Sheet','Google Sheet名':'入退室ログ２','Apps Script種別':'使用なし','Apps Script確認':'Apps Scriptなし（確認済み）','正本ファイル':'student_qr_register.html / tablet_checkin.html','確認済み事項':['利用画面','読取画面','GitHub','保存先：入退室ログ２','Apps Scriptなし'],'確認状況':'確認済み'});if(name.includes('受付カード'))Object.assign(patch,{'Google Sheet名':'受付カード一覧','使用シート名':'受付カード一覧','Apps Script種別':'Google Sheetバインド型','Apps Script確認':(item['Apps Script編集URL']||'').trim()?'Apps Script確認済み・編集URL登録済み':'Apps Script確認済み・編集URL未登録','確認済み事項':['利用画面','Google Sheet','Google Sheet名・使用シート','Apps Script確認済み内容'],'確認状況':'確認済み情報を反映'});if(name.includes('不達メール'))Object.assign(patch,{'保存基盤':'Google Sheet','Google Sheet名':'入退室ログ２','使用シート名':'不達メール管理','関連カード':['STEPメッセージ'],'確認済み事項':['利用画面','保存先','Apps Script','GitHub','STEPメッセージとの関連'],'確認状況':'確認済み情報を反映'});if(name.includes('お問い合わせ管理'))Object.assign(patch,{'保存基盤':'Google Sheet','Google Sheet URL':'https://docs.google.com/spreadsheets/d/18VKKfPZ_AE-j-mz995Aru0KLLsWsFdoizBXH9PTYyaA/edit?gid=364872372#gid=364872372','Google Sheet名':'お問い合わせ管理','管理対象':'反応リスト','使用シート名':'お問い合わせ','電話番号列':'J列','電話番号形式':'ハイフン入り','保存先Spreadsheet ID':'18VKKfPZ_AE-j-mz995Aru0KLLsWsFdoizBXH9PTYyaA','Apps Script種別':'Google Sheetバインド型','Apps Script概要':'問い合わせ受付、自動返信、管理者通知、週次確認、Google連絡先登録更新、電話番号のハイフン形式への正規化','Apps Script確認':(item['Apps Script編集URL']||'').trim()?'Apps Scriptコード確認済み・編集URL登録済み':'Apps Scriptコード確認済み・編集URL未登録','連携メモ':['People API使用','生徒管理側の連絡先を優先'],'関連カード':['生徒マスタ'],'確認済み事項 確認項目':['Google Sheet・Apps Scriptとの関係'],'確認状況':'登録画面・Supabase確認済み / Google Sheet・Apps Script関係未確認'});if(name.includes('請求管理'))Object.assign(patch,{'確認済み事項':['本番URL','Spreadsheet ID'],'未確認項目':['バインドApps Scriptとの対応'],'確認状況':'本番URL・Spreadsheet ID確認済み / Apps Script対応未確認'});return Object.keys(patch).length?Object.assign({},item,patch):item}
const CARD_ANCHORS=[['生徒マスタ','student-master'],['お問い合わせ管理','contact-management'],['成績管理','grade-management'],['面談メモ','meeting-memo'],['受付カード','juku-card'],['出退くん','qr-register'],['不達メール','delivery-failures'],['欠席・遅刻連絡','absence-contact'],['過去問','past-exams'],['STEPメッセージ','step-message'],['STEP配信','step-message'],['講師スケジュール','teacher-schedule'],['講師予定','teacher-schedule'],['夏休み出勤','teacher-schedule'],['請求管理','billing']];function anchorFromName(name){const hit=CARD_ANCHORS.find(([key])=>String(name||'').includes(key));return hit?hit[1]:String(name||'system').toLowerCase().replace(/[^a-z0-9_-]+/g,'-')}function cardAnchor(item){return 'system-'+(anchorFromName(item['システム名'])||item['ID']||'card')}

<script>
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const AUTH_KEY='stepStaffAppAuth';
const GROUPS=[
  {title:'利用する',fields:[['利用者向けURL','利用者向けアプリを開く'],['読み取りURL','読み取りアプリを開く'],['印刷URL','印刷ページを開く'],['Apps Script WebアプリURL','Webアプリを開く'],['GitHub Pages URL','公開ページを開く']]},
  {title:'管理する',fields:[['管理者向けURL','管理者向けアプリを開く'],['Google Sheet URL','Google Sheetを開く'],['Supabase URL','Supabase管理画面を開く'],['入力フォームURL','登録画面を開く']]},
  {title:'修正する',fields:[['GitHub URL','GitHubを開く'],['Apps Script編集URL','Apps Scriptを編集']]},

let systems=[];

function auth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}
async function api(action,extra){const a=auth();const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,systemPortalSessionToken:a?.systemPortalSessionToken||''},extra||{})),redirect:'follow'});return res.json()}
async function init(){const a=auth();if(!a||!['2','3','4'].includes(String(a.permissionLevel))||!a.systemPortalSessionToken)return deny('権限2・3・4で再ログインしてください。');try{const out=await api('getSystemRegistry');if(!out.success)throw new Error(out.error||'台帳を取得できませんでした。');systems=organizeEntryImport(Array.isArray(out.systems)?out.systems:[]);fillFilters();document.getElementById('portal').classList.remove('hidden');render()}catch(e){deny(e.message||'権限を確認できませんでした。再ログインしてください。')}}
function deny(message){document.getElementById('portal').classList.add('hidden');const el=document.getElementById('denied');el.textContent=message;el.classList.remove('hidden')}

function fillFilters(){fill('category',unique(systems.map(x=>x['分類'])));fill('status',unique(systems.map(x=>x['状態'])))}

async function copyUrl(url){try{await navigator.clipboard.writeText(url)}catch(e){const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const toast=document.getElementById('toast');toast.classList.remove('hidden');clearTimeout(copyUrl.timer);copyUrl.timer=setTimeout(()=>toast.classList.add('hidden'),1800)}
