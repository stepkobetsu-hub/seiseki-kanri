<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STEP総合管理ポータル</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/system-portal/favicon.png?v=20260720-hex">
  <link rel="shortcut icon" type="image/png" href="images/system-portal/favicon.png?v=20260720-hex">
  <link rel="apple-touch-icon" href="images/system-portal/apple-touch-icon.png?v=20260720-hex">
  <style>
    :root{color-scheme:light;--navy:#102a43;--blue:#2563eb;--line:#d8e2ec;--bg:#f4f7fb;--muted:#627d98;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#152536}
    button,input,select{font:inherit}.hidden{display:none!important}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:58px;height:58px;border-radius:14px;object-fit:cover;box-shadow:0 5px 15px rgba(16,42,67,.16)}h1{font-size:clamp(24px,4vw,36px);margin:0;color:var(--navy)}
    .lead{margin:7px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.open,.copy{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;text-decoration:none}
    .btn{background:#e6edf5;color:var(--navy)}.open{background:var(--blue);color:#fff}.copy{background:#edf4ff;color:#1d4ed8}.copy:focus-visible,.open:focus-visible,.btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .notice{padding:14px 16px;border:1px solid #f3c8c4;background:#fff3f2;border-radius:12px;color:var(--danger);font-weight:700}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 220px 220px auto;gap:10px;margin:18px 0}
    .toolbar input,.toolbar select{width:100%;border:1px solid #bcccdc;border-radius:10px;padding:11px 12px;background:#fff}.count{color:var(--muted);font-weight:700;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(16,42,67,.06);min-width:0}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card h2{font-size:20px;margin:0;color:var(--navy)}.status{white-space:nowrap;padding:4px 9px;border-radius:999px;background:#e7f8ef;color:#147d4d;font-weight:800;font-size:12px}
    .meta{color:var(--muted);font-size:13px;margin:5px 0}.summary{line-height:1.65}.group{border-top:1px solid #edf2f7;margin-top:14px;padding-top:12px}.group h3{font-size:14px;margin:0 0 9px;color:#486581}
    .link-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;margin:7px 0}.link-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.unknown{font-size:13px;color:#7c5d00;background:#fff8d9;border-radius:8px;padding:8px 10px;margin:6px 0}
    .details{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.6;color:#486581}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#102a43;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5}
    @media(max-width:780px){header{display:block}.top-actions{margin-top:12px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}.link-row{grid-template-columns:1fr auto}.link-row .copy{grid-column:2}.shell{width:min(100% - 20px,1180px)}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><img class="brand-icon" src="images/system-portal/app-icon-192.png?v=20260720" alt="STEP総合管理ポータル"><div><h1>STEP総合管理ポータル</h1><p class="lead">権限2・3・4で利用できます。利用・管理・共有用の入口をまとめて確認できます。</p></div></div>
      <div class="top-actions"><a class="btn" href="index.html">スタッフ用アプリへ戻る</a><button class="btn" id="logoutBtn" type="button">ログアウト</button></div>
    </header>
    <section id="denied" class="notice hidden" role="alert"></section>
    <section id="portal" class="hidden">
      <div class="toolbar">
        <input id="search" type="search" placeholder="システム名・概要・担当・注意事項を検索">
        <select id="category"><option value="">すべての分類</option></select>
        <select id="status"><option value="">すべての状態</option></select>
        <button class="btn" id="clearBtn" type="button">クリア</button>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="cards"></div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite">URLをコピーしました</div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const AUTH_KEY='stepStaffAppAuth';
const GROUPS=[
  {title:'利用する',fields:[['利用者向けURL','利用者向けアプリを開く'],['管理者向けURL','管理者向けアプリを開く'],['読み取りURL','読み取りアプリを開く'],['印刷URL','印刷ページを開く'],['Apps Script WebアプリURL','Webアプリを開く'],['GitHub Pages URL','GitHub Pagesを開く']]},
  {title:'管理する',fields:[['Google Sheet URL','Google Sheetを開く'],['Apps Script編集URL','Apps Scriptを編集'],['GitHub URL','GitHubを開く'],['DriveファイルURL','Driveファイルを開く'],['DriveフォルダURL','Driveフォルダを開く'],['Supabase URL','Supabase管理画面を開く']]},
  {title:'共有する',fields:[['入力フォームURL','入力フォームを開く']]},
  {title:'関連・旧版',fields:[['旧版URL','旧版を開く']]}
];
let systems=[];
document.addEventListener('DOMContentLoaded',init);
document.getElementById('search').addEventListener('input',render);
document.getElementById('category').addEventListener('change',render);
document.getElementById('status').addEventListener('change',render);
document.getElementById('clearBtn').addEventListener('click',()=>{document.getElementById('search').value='';document.getElementById('category').value='';document.getElementById('status').value='';render()});
document.getElementById('logoutBtn').addEventListener('click',logout);

function auth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}
async function api(action,extra){const a=auth();const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,systemPortalSessionToken:a?.systemPortalSessionToken||''},extra||{})),redirect:'follow'});return res.json()}
async function init(){const a=auth();if(!a||!['2','3','4'].includes(String(a.permissionLevel))||!a.systemPortalSessionToken)return deny('権限2・3・4で再ログインしてください。');try{const out=await api('getSystemRegistry');if(!out.success)throw new Error(out.error||'台帳を取得できませんでした。');systems=Array.isArray(out.systems)?out.systems:[];fillFilters();document.getElementById('portal').classList.remove('hidden');render()}catch(e){deny(e.message||'権限を確認できませんでした。再ログインしてください。')}}
function deny(message){document.getElementById('portal').classList.add('hidden');const el=document.getElementById('denied');el.textContent=message;el.classList.remove('hidden')}
async function logout(){try{await api('logoutSystemPortal')}catch(e){}localStorage.removeItem(AUTH_KEY);location.href='index.html'}
function fillFilters(){fill('category',unique(systems.map(x=>x['分類'])));fill('status',unique(systems.map(x=>x['状態'])))}
function fill(id,values){const s=document.getElementById(id);values.forEach(v=>{if(!v)return;const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
function unique(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ja'))}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const c=document.getElementById('category').value;const st=document.getElementById('status').value;const list=systems.filter(x=>(!c||x['分類']===c)&&(!st||x['状態']===st)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));const root=document.getElementById('cards');root.replaceChildren(...list.map(card));document.getElementById('count').textContent=`${list.length}件 / 全${systems.length}件`}
function isQrRegister(item){return item['ID']==='qr-register'||item['システム名']==='出退くんQR作成・読取'}
function isJukuCard(item){return item['ID']==='juku-card'||item['システム名']==='受付カード読み取り'}
function applyConfirmedInfo(item){const name=String(item['システム名']||'');const target=['出退くん','受付カード','不達メール','成績管理','面談メモ','過去問','STEPメッセージ','STEP配信','講師スケジュール','講師予定','夏休み出勤','請求管理'].some(key=>name.includes(key));if(!target)return item;const patch={'確認状況':'確認済'};if(name.includes('受付カード'))Object.assign(patch,{'Google Sheet名':'受付カード一覧','使用シート名':'受付カード一覧'});if(name.includes('不達メール'))Object.assign(patch,{'Google Sheet名':'入退室ログ２','使用シート名':'不達メール管理'});return Object.assign({},item,patch)}
function card(item){item=applyConfirmedInfo(item);const article=el('article','card');const head=el('div','card-head');const title=el('h2','',item['システム名']||'名称未設定');head.append(title,el('span','status',item['状態']||'要確認'));article.append(head,el('p','meta',[item['分類'],item['利用者']&&`利用者：${item['利用者']}`,item['運用担当']&&`担当：${item['運用担当']}`].filter(Boolean).join(' / ')),el('p','summary',item['概要']||''));const usedUrls=new Set();GROUPS.forEach(g=>{const section=el('section','group');section.append(el('h3','',`【${g.title}】`));let count=0;g.fields.forEach(([field,label])=>{if(isQrRegister(item)&&field==='Apps Script編集URL')return;const value=linkUrl(item,field,(item[field]||'').trim());if(value&&!usedUrls.has(value)){usedUrls.add(value);section.append(linkRow(linkLabel(item,field,label),value));count++}});if(g.title==='管理する'){[['Google Sheet URL','保存先Sheet'],['Apps Script編集URL','Apps Script']].forEach(([field,label])=>{if(isQrRegister(item)||(isJukuCard(item)&&field==='Apps Script編集URL'))return;if(!(item[field]||'').trim()&&String(item['確認状況']||'').includes('要確認')){section.append(el('div','unknown',`${label}：要確認`));count++}})}if(count)article.append(section)});if(String(item['システム名']||'').includes('STEP統合管理ポータル（公開版）')){const related=el('section','group');related.append(el('h3','','【関連】'),linkRow('STEP総合管理ポータルを開く','https://stepkobetsu-hub.github.io/seiseki-kanri/system_portal.html'));article.append(related)}const detail=isQrRegister(item)?['保存先Sheet：入退室ログ２','ソース：tablet_checkin',item['関連システム']&&`関連：${item['関連システム']}`,item['共有用途']&&`共有用途：${item['共有用途']}`,item['更新日']&&`更新日：${item['更新日']}`,'確認状況：確認済'].filter(Boolean):[item['Google Sheet名']&&`Google Sheet名：${item['Google Sheet名']}`,item['使用シート名']&&`使用シート：${item['使用シート名']}`,item['関連システム']&&`関連：${item['関連システム']}`,item['共有用途']&&`共有用途：${item['共有用途']}`,item['注意事項']&&`注意：${item['注意事項']}`,item['更新日']&&`更新日：${item['更新日']}`,item['確認状況']&&`確認状況：${item['確認状況']}`].filter(Boolean);if(detail.length)article.append(el('div','details',detail.join('\n')));return article}
function isGradeSystem(item){return String(item['システム名']||'').includes('成績管理')}
function linkLabel(item,field,fallback){if(isJukuCard(item)&&field==='Apps Script編集URL')return 'Apps Scriptを開く';if(item['ID']==='past-exams'){if(field==='利用者向けURL')return '📚 過去問を探す';if(field==='入力フォームURL')return '📝 過去問を提出する';if(field==='管理者向けURL')return '⚙️ 管理者'}if(isGradeSystem(item)){if(field==='利用者向けURL')return '生徒が成績を入力する';if(field==='管理者向けURL')return '成績管理の管理者画面を開く';if(field==='読み取りURL')return 'エントリーシート読み取りアプリを開く'}return fallback}
function linkUrl(item,field,value){if(item['ID']==='past-exams'){if(['利用者向けURL','管理者向けURL','Apps Script WebアプリURL'].includes(field))return new URL('past_exam_db.html',location.href).href;if(field==='入力フォームURL')return new URL('past_exam_upload.html',location.href).href}if(isGradeSystem(item)){if(field==='利用者向けURL')return new URL('juku_app.html',location.href).href;if(field==='管理者向けURL')return new URL('admin.html',location.href).href}return value}
function linkRow(label,url){const row=el('div','link-row');row.append(el('span','link-name',label));const a=el('a','open','開く');a.href=url;a.target='_blank';a.rel='noopener noreferrer';const b=el('button','copy','URLをコピー');b.type='button';b.addEventListener('click',()=>copyUrl(url));row.append(a,b);return row}
async function copyUrl(url){try{await navigator.clipboard.writeText(url)}catch(e){const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const toast=document.getElementById('toast');toast.classList.remove('hidden');clearTimeout(copyUrl.timer);copyUrl.timer=setTimeout(()=>toast.classList.add('hidden'),1800)}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
</script>
</body>
</html>
