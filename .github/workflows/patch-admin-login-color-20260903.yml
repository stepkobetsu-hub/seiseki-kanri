name: Patch admin login color 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-login-color-20260903.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tint admin login screen
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8-sig')
          old1 = '.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f7f4}'
          new1 = '.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e7f5ee}'
          old2 = '.loginBox{background:#fff;border:1px solid #b7e0cc;border-radius:var(--radius);padding:44px 40px;width:100%;max-width:520px;box-shadow:0 4px 24px rgba(16,120,70,.12)}'
          new2 = '.loginBox{background:#f2fbf6;border:2px solid #9bd4b6;border-radius:var(--radius);padding:44px 40px;width:100%;max-width:520px;box-shadow:0 4px 24px rgba(16,120,70,.14)}'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected login CSS not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8-sig')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "管理者ログイン画面を薄緑で区別" || exit 0
          git push
