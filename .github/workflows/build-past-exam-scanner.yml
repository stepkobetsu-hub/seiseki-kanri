name: Build STEP Past Exam Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-past-exam-scanner/**"
      - ".github/workflows/build-past-exam-scanner.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-past-exam-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEP-PastExam-Scanner-debug
          path: android-past-exam-scanner/app/build/outputs/apk/debug/app-debug.apk
