<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155aa5"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><title>良い事や行事予定｜個別指導STEP</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102033;font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:16px}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d9e3ef;padding:12px 16px}.head{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.25rem;margin:0}.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.staff{font-size:.875rem;color:#52667c}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d9e3ef;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 20px #1539720a}h2{font-size:1.15rem;margin:0 0 14px}label{display:block;font-size:.95rem;font-weight:700;margin-bottom:6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #bdcde0;border-radius:9px;padding:11px;min-height:46px;background:#fff;color:#102033}textarea{min-height:170px;line-height:1.6;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn,button{border:1px solid #cbd8e6;background:#f7fafc;color:#155aa5;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;justify-content:center}.primary{background:#155aa5;color:#fff;border-color:#155aa5;min-width:150px}.logout{color:#b42318;background:#fff}button:disabled{opacity:.5;cursor:wait}.note{color:#52667c;font-size:.9rem;line-height:1.6;margin:0 0 16px}.check{display:flex;align-items:flex-start;gap:9px;font-weight:400;line-height:1.5}.check input{width:20px;min-height:20px;margin:2px 0 0;flex-shrink:0}.status{margin-top:12px;line-height:1.5;white-space:pre-wrap}.error{color:#b42318}.success{color:#146e51}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.history-head h2{margin:0}.report{border:1px solid #d9e3ef;border-radius:12px;padding:16px;margin-top:12px}.report-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.report h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}.report-meta{font-size:.875rem;color:#52667c;line-height:1.7;margin:8px 0}.report-body{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.pill{display:inline-block;background:#edf4ff;color:#155aa5;border-radius:6px;padding:3px 8px;font-size:.875rem;margin-right:6px}.gate{max-width:480px;margin:30px auto}.device{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.device button.active{background:#155aa5;color:white}.hidden,[hidden]{display:none!important}footer{max-width:980px;margin:auto;padding:0 16px 24px;color:#52667c;font-size:.875rem}.scope{color:#52667c;font-size:.9rem;margin:0 0 12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}main{padding:12px}.staff{display:none}.head-actions .btn,.head-actions button{padding:8px 10px;font-size:.875rem}h1{font-size:1.1rem}.report-top{flex-wrap:wrap}}
</style></head><body>
<header><div class="head"><h1>良い事や行事予定</h1><div class="head-actions"><span id="staffLabel" class="staff"></span><a class="btn" href="meeting_memo.html">面談メモへ</a><button id="logoutButton" class="logout" hidden>ログアウト</button></div></div></header>
<section id="loginGate" class="card gate"><h2>講師ログイン</h2><p class="note">面談メモと同じ講師コード・パスワードで入れます。</p><form id="loginForm"><label>この端末</label><div class="device"><button type="button" data-device="personal">自分の端末</button><button type="button" data-device="shared">塾の共用端末</button></div><label for="loginCode">講師コード</label><input id="loginCode" autocomplete="username" required><label for="loginPassword" style="margin-top:14px">パスワード</label><input id="loginPassword" type="password" autocomplete="current-password" required><div class="actions"><button id="loginButton" class="primary">ログイン</button></div><p id="loginError" class="status error" role="alert"></p></form></section>
<main id="app" hidden>
<section class="card" id="formCard"><h2 id="formTitle">報告内容を入力</h2><p class="note">教室であった良い事や頑張り、これからの行事予定などを教えてください。送信した内容はSTEP広報窓口のお知らせと話題に届きます。</p>
<form id="reportForm"><div class="grid"><div><label for="campus">校舎</label><select id="campus"><option>両校</option><option>神領校</option><option>大手町校</option></select></div><div><label for="category">種類</label><select id="category"><option>良い事・頑張り</option><option>行事予定</option><option>教室の様子</option><option>プログラミング</option><option>その他</option></select></div><div><label for="eventDate">出来事・予定の日付（任意）</label><input id="eventDate" type="date"></div><div class="full"><label for="title">件名</label><input id="title" required maxlength="120" placeholder="例：テスト対策で最後まで頑張りました"></div><div class="full"><label for="body">内容</label><textarea id="body" required maxlength="3000" placeholder="いつ、どんなことがあったか、どんな予定かをご記入ください。"></textarea></div><div class="full"><label class="check"><input id="externalUse" type="checkbox"><span>この内容をホームページ・SNSなどの発信に使ってよい</span></label></div></div><div class="actions"><button id="sendButton" class="primary">送信</button><button id="cancelButton" type="button" hidden>編集をやめる</button></div><p id="saveStatus" class="status" role="status" aria-live="polite"></p></form></section>
<section class="card"><div class="history-head"><h2>以前の報告</h2><button id="refreshButton" type="button">一覧を更新</button></div><p id="scopeLabel" class="scope"></p><div id="history" aria-live="polite"></div><p id="historyStatus" class="status error" role="alert"></p><div class="actions"><button id="moreButton" hidden>さらに表示</button></div></section>
</main><footer>個別指導STEP · 神領校 / 大手町校</footer>
<script src="assets/js/staff-auth.js?v=20261007-reports"></script><script src="assets/js/classroom-reports.js?v=20261007"></script>
</body></html>
